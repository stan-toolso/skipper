  "Données propres au type : { toolName, input, suggestions } pour 'permission', { questions } pour 'question'."
  payload: JSON!
  "Réponse fournie : { decision: allow|deny, always?, message? } pour 'permission', { answers: { question: réponse } } pour 'question'."
  response: JSON
  "Qui a répondu ou annulé."
  answeredBy: User
  createdAt: DateTime!
  answeredAt: DateTime
}

"Fichier joint à une instruction ; téléchargeable sur GET /api/attachments/<session>/<id> (cookie de session)."
