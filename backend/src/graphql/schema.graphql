  MERGED
  CLOSED
}

"Étape d'une pull request suivie, dérivée de son statut et de son brouillon."
enum PullRequestStage {
  "En préparation : la branche porte des modifications, aucune pull request n'est ouverte."
  PENDING
  "Ouverte en brouillon."
  DRAFT
  "Ouverte : à relire et fusionner."
  TO_MERGE
  "Fusionnée."
  MERGED
  "Fermée sans fusion."
  CANCELLED
}

"""
Pull request suivie : l'objet qui matérialise une PR dans Skipper, rattaché à un projet et le plus souvent à une tâche.
Elle existe avant GitHub (« en préparation » : une branche porte des modifications sans PR ouverte) et peut viser un
autre dépôt que celui du projet. Créée par la synchronisation (travail local des branches, PR GitHub adoptées), par une
session d'agent (outils tasks.pr_open / pr_register) ou par l'interface ; son statut et son instantané GitHub sont
rafraîchis à la synchronisation.
"""
type TrackedPullRequest {
  id: ID!
  project: Project!
  task: Task
  "Dépôt GitHub « owner/name » de la PR (celui du projet le plus souvent) ; vide sans GitHub."
  repo: String!
  "La PR est dans un autre dépôt que celui du projet."
  foreignRepo: Boolean!
  "Numéro GitHub ; null tant que la PR est en préparation."
  number: Int
  "URL GitHub ; vide tant que la PR est en préparation."
  url: String!
  "Work session (branche) dont la PR suit le travail, quand elle est connue."
  worksession: Worksession
  "PR en préparation : commits en avance sur la base, constatés à la dernière synchronisation."
  localCommits: Int
  "PR en préparation : fichiers modifiés non commités, constatés à la dernière synchronisation."
  localChanges: Int
  title: String!
  headBranch: String!
  baseBranch: String!
  status: TrackedPullRequestStatus!
  isDraft: Boolean!
  stage: PullRequestStage!
  "Instantané GitHub du dernier rafraîchissement : SUCCESS, FAILURE, PENDING, ERROR, EXPECTED, ou null."
  checksState: String
  "APPROVED, CHANGES_REQUESTED, REVIEW_REQUIRED, ou null."
  reviewDecision: String
  "MERGEABLE, CONFLICTING, UNKNOWN, ou null."
  mergeable: String
  syncedAt: DateTime
  "Commit de fusion, quand la fusion a été faite depuis Skipper."
  mergeSha: String
  "Note libre de suivi (« attend la CI », « revue demandée »…)."
  note: String!
  "'human', 'agent' ou 'system' (synchronisation GitHub)."
  createdByType: String!
  createdBy: User
  createdBySession: Session
  "Ouverture sur GitHub."
  openedAt: DateTime!
  mergedAt: DateTime
  closedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  "La PR GitHub en direct (checks, revues, fusion), null si GitHub ne répond pas."
  github: PullRequest
  """
  Session d'agent rattachée : la session (non archivée) la plus récente du dossier de travail de la branche de la PR,
  sinon celle qui a ouvert la PR. C'est elle qui reçoit la demande de résolution des conflits.
  """
  session: Session
}

