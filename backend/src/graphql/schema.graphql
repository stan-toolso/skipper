  clearWorkflowSchedule(id: ID!): Workflow!

  "Invite une personne dans l'application, administratrice ou non (administrateurs)."
  inviteUser(email: String!, isAdmin: Boolean = false): User!
  setUserAdmin(userId: ID!, isAdmin: Boolean!): User!
  "Super administrateurs seulement."
  setUserSuperAdmin(userId: ID!, isSuperAdmin: Boolean!): User!
  deleteUser(userId: ID!): Boolean!
  "Invite un e-mail sur le projet (l'utilisateur est créé s'il n'existe pas) ou change son rôle. Réservé aux administrateurs du projet."
  inviteProjectMember(projectId: ID!, email: String!, role: ProjectRole = MEMBER): ProjectMember!
  updateProjectMemberRole(projectId: ID!, userId: ID!, role: ProjectRole!): ProjectMember!
  removeProjectMember(projectId: ID!, userId: ID!): Boolean!
