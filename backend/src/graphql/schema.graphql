input CreateProjectInput {
  name: String!
  "Optionnel : dérivé du nom si absent."
  slug: String
  description: String
  systemPrompt: String
  gitUrl: String
  gitBranch: String
  "Héberger le dépôt dans Skipper (exclusif de gitUrl). À la modification : un projet sans dépôt devient hébergé (dossier existant importé) ; l'hébergement ne se désactive pas."
  gitHosted: Boolean
  runnerConfig: JSON
  defaultPermissionMode: String
  taskInstructions: String
}

input UpdateProjectInput {
  name: String
  description: String
  systemPrompt: String
  gitUrl: String
  gitBranch: String
  "Héberger le dépôt dans Skipper (exclusif de gitUrl). À la modification : un projet sans dépôt devient hébergé (dossier existant importé) ; l'hébergement ne se désactive pas."
  gitHosted: Boolean
  runnerConfig: JSON
  defaultPermissionMode: String
  taskInstructions: String
}

"Work session à créer en même temps que la session, qui s'y exécutera. Sans nom, branche ni libellé : nommée d'après la consigne."
input NewWorksessionInput {
  "Branche (projet git) extraite si elle existe (localement ou sur origin), sinon créée depuis baseRef ; défaut : le nom du dossier."
  branch: String
  "Nom du dossier (défaut : dérivé de la branche, sinon du libellé)."
  name: String
  "Libellé : ce dont parle la work session."
  label: String
  baseRef: String
}

"Fichier joint à une instruction : contenu encodé en base64 (10 Mo par fichier, 12 Mo par instruction, 10 fichiers au plus)."
input AttachmentInput {
  name: String!
  mediaType: String!
  data: String!
}

input CreateSessionInput {
  projectId: ID!
  "Work session où la session s'exécute (obligatoire, sauf newWorksession)."
  worksessionId: ID
  "Crée d'abord cette work session et y lance la session (exclusif avec worksessionId)."
  newWorksession: NewWorksessionInput
  name: String!
  provider: String!
  "Première instruction. Facultative : sans consigne ni fichier joint, la session est créée sans démarrer et attend sa première instruction."
  prompt: String
  "Fichiers joints à la première instruction."
  attachments: [AttachmentInput!]
  config: JSON
  "Démarre la session immédiatement après création (défaut : true) ; sans effet sans consigne."
  autoStart: Boolean
}

type Mutation {
  "Écrit un fichier. Avec expectedModifiedAt, refuse (FILE_CONFLICT) si le fichier a changé depuis."
