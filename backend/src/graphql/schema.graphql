}

# ---- Paramètres (par personne : Claude, OpenCode, GitHub ; serveur : administrateurs) -----------------

"Comment les sessions d'une personne s'authentifient auprès de Claude : jeton OAuth de son abonnement obtenu depuis l'interface (oauth), ou clé API (api_key). Les deux sont des jetons applicatifs du coffre."
