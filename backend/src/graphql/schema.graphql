scalar JSON
scalar DateTime

enum SessionStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  STOPPED
  INTERRUPTED
}

type ConfigOption {
  value: String!
  label: String!
  description: String
}

type ConfigField {
  key: String!
  label: String!
  type: String!
  required: Boolean!
  description: String
  options: [ConfigOption!]
  defaultValue: String
  "Affiché dans la section « Options avancées »."
  advanced: Boolean
}

"Un type d'agent que l'on peut exécuter en session (Claude, shell, ...)."
type Provider {
  type: String!
  label: String!
  description: String!
  "true si l'on peut envoyer des instructions à une session en cours."
  interactive: Boolean!
  configFields: [ConfigField!]!
}

"Pour une session en cours : l'agent travaille ou attend des instructions."
enum SessionActivity {
  BUSY
  IDLE
}

# ---- Utilisateurs et accès ----------------------------------------------------------------------

"Rôle d'un utilisateur sur un projet : ADMIN gère le projet et ses membres, MEMBER lance sessions et terminaux, VIEWER consulte seulement."
enum ProjectRole {
  ADMIN
  MEMBER
  VIEWER
}

"Utilisateur de l'application (connexion Google). Il n'existe que s'il a été invité sur un projet."
type User {
  id: ID!
  email: String!
  name: String!
  avatarUrl: String
  "Administrateur de l'application : accès aux paramètres généraux."
  isAdmin: Boolean!
  createdAt: DateTime!
  "Null tant que l'utilisateur ne s'est jamais connecté."
  lastLoginAt: DateTime
}

"Appartenance d'un utilisateur à un projet."
type ProjectMember {
  user: User!
  role: ProjectRole!
  invitedBy: User
  createdAt: DateTime!
  "Invité mais jamais connecté."
  pending: Boolean!
}

"Un projet regroupe des sessions ; chacune s'exécute dans le workspace du projet."
type Project {
  id: ID!
  name: String!
  "Nom du dossier du projet dans WORKSPACES_ROOT (fixé à la création)."
  slug: String!
  description: String
  "Ajouté au prompt système des agents qui le supportent."
  systemPrompt: String!
  gitUrl: String
  gitBranch: String
  "Réglages du conteneur Docker du projet : { image, memory, cpus, browser }."
  runnerConfig: JSON!
  "Mode d'autorisation des nouvelles sessions qui n'en précisent pas (default, acceptEdits, bypassPermissions, plan)."
  defaultPermissionMode: String!
  "Noms des connexions dont les appels sont soumis à l'approbation d'un humain (non soumis en mode bypassPermissions)."
  approvalConnections: [String!]!
  runnerStatus: RunnerStatus!
  "Chemin absolu du workspace sur le serveur."
  workspacePath: String!
  workspaceExists: Boolean!
  "Branche et commit courants du workspace, si c'est un dépôt git."
  git: WorkspaceGit
  createdAt: DateTime!
  updatedAt: DateTime!
  sessions(status: SessionStatus, limit: Int, offset: Int): [Session!]!
  "Bibliothèque de contexte : dossiers et instructions à plat, avec leur chemin."
  contextFolders: [ContextFolder!]!
  contextInstructions: [ContextInstruction!]!
  contextChanges(limit: Int): [ContextChange!]!
  terminals: [Terminal!]!
  tasks(status: [TaskStatus!]): [Task!]!
  worktrees: [Worktree!]!
  connections: [Connection!]!
  "Comptes Google reliés au projet (Gmail, Drive)."
  googleAccounts: [GoogleAccount!]!
  members: [ProjectMember!]!
  "Rôle de l'utilisateur connecté sur ce projet."
  myRole: ProjectRole!
  "Autorisations d'outils mémorisées pour le projet (« ne plus demander dans ce projet »)."
  permissionRules: [PermissionRule!]!
}

"Règle d'autorisation d'outil mémorisée pour un projet, au format des permissions Claude Code (Read, Bash(git status:*)...)."
type PermissionRule {
  id: ID!
  projectId: ID!
  toolName: String!
  "Motif propre à l'outil ; null = tout l'outil."
  ruleContent: String
  "Forme textuelle : toolName ou toolName(ruleContent)."
  rule: String!
  "Session pendant laquelle la règle a été mémorisée, le cas échéant."
  createdBySession: Session
  createdAt: DateTime!
}

"Dossier de la bibliothèque de contexte d'un projet."
type ContextFolder {
  id: ID!
  projectId: ID!
  parentId: ID
  name: String!
  slug: String!
  "Chemin de slugs depuis la racine, ex. \"api/auth\"."
  path: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Instruction (document Markdown) de la bibliothèque de contexte, versionnée."
type ContextInstruction {
  id: ID!
  projectId: ID!
  folderId: ID
  name: String!
  slug: String!
  path: String!
  description: String!
  content: String!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  versions: [ContextInstructionVersion!]!
}

type ContextInstructionVersion {
  id: ID!
  version: Int!
  name: String!
  description: String!
  content: String!
  changeNote: String
  "'human' (interface) ou 'agent' (session)."
  authorType: String!
  authorSession: Session
  createdAt: DateTime!
}

"Entrée du journal des modifications du contexte d'un projet."
type ContextChange {
  id: ID!
  "folder.create, folder.rename, folder.move, folder.delete, instruction.create, instruction.update, instruction.move, instruction.delete, instruction.restore"
  kind: String!
  path: String!
  details: JSON!
  authorType: String!
  authorSession: Session
  createdAt: DateTime!
}

enum TaskStatus {
  TODO
  IN_PROGRESS
  DONE
  CANCELLED
}

enum TaskPriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

"Tâche d'un projet, avec priorité. Créée et mise à jour par les humains ou les agents (outils MCP `tasks`)."
type Task {
  id: ID!
  project: Project!
  title: String!
  description: String!
  status: TaskStatus!
  priority: TaskPriority!
  "Session d'agent qui s'en occupe, le cas échéant."
  session: Session
  "'human' ou 'agent'."
  createdByType: String!
  createdBySession: Session
  "Échéance AAAA-MM-JJ."
  dueDate: String
  "Branche git de la tâche (worktree dédié task/<slug>), conservée après suppression du worktree."
  branch: String
  "Pull request GitHub de la branche de la tâche (ouverte de préférence), null si aucune ou si GitHub ne répond pas."
  pullRequest: PullRequest
  createdAt: DateTime!
  updatedAt: DateTime!
  completedAt: DateTime
}

input CreateTaskInput {
  projectId: ID!
  title: String!
  description: String
  priority: TaskPriority
  status: TaskStatus
  dueDate: String
}

input UpdateTaskInput {
  title: String
  description: String
  priority: TaskPriority
  status: TaskStatus
  "Session assignée (null pour retirer)."
  sessionId: ID
  dueDate: String
}

"Notification affichée dans la cloche de l'interface."
type Notification {
  id: ID!
  "request.created, task.created, task.completed, session.completed, session.failed, context.created"
  type: String!
  title: String!
  message: String
  "Chemin dans l'application vers l'élément concerné."
  link: String
  project: Project
  session: Session
  payload: JSON!
  readAt: DateTime
  createdAt: DateTime!
}

enum TerminalStatus {
  RUNNING
  CLOSED
}

"Terminal web : un shell interactif lancé dans le workspace du projet, relié par WebSocket (/terminals/<id>)."
type Terminal {
  id: ID!
  project: Project!
  worktree: Worktree
  name: String!
  status: TerminalStatus!
  exitCode: Int
  createdAt: DateTime!
  closedAt: DateTime
}

"Worktree git d'un projet : une branche extraite dans son propre dossier, à côté du checkout principal."
type Worktree {
  id: ID!
  project: Project!
  "Nom du dossier."
  name: String!
  branch: String!
  path: String!
  exists: Boolean!
  git: WorkspaceGit
  createdAt: DateTime!
  sessions: [Session!]!
  terminals: [Terminal!]!
}

# ---- Connexions ------------------------------------------------------------------------------------

"Type de système distant."
enum ConnectionKind {
  ssh
  postgres
  "Site web : une adresse et autant de champs qu'on veut (identifiant, mot de passe...), utilisés par le navigateur headless des agents."
  website
}

"Comment les agents accèdent à la connexion : outils MCP (le serveur garde les identifiants ; pour un site web, le navigateur headless saisit les secrets), shell de la session (ssh, psql, variables d'environnement), ou les deux."
enum ConnectionExposure {
  mcp
  direct
  both
}

"Champ d'un site web (identifiant, mot de passe, code d'organisation...)."
type ConnectionField {
  "Clé technique (minuscules, chiffres, soulignés)."
  key: String!
  label: String!
  secret: Boolean!
  "Valeur d'un champ public ; null pour un secret (jamais renvoyé)."
  value: String
  "Nom de variable sous lequel le navigateur et le shell des agents désignent le champ (ex. ADMIN_SITE_PASSWORD)."
  variable: String!
}

"Connexion d'un projet vers un système externe (serveur SSH, base PostgreSQL, site web), utilisable par les agents. Les secrets ne sont jamais renvoyés."
type Connection {
  id: ID!
  project: Project!
  "Nom court employé par les agents (ex. prod, rds-prod)."
  name: String!
  kind: ConnectionKind!
  description: String!
  "ssh, postgres : hôte (null pour un site web)."
  host: String
  "ssh, postgres : port (null pour un site web)."
  port: Int
  "ssh, postgres : utilisateur (null pour un site web)."
  username: String
  "website : adresse du site ou de sa page de connexion."
  url: String
  "website : champs, dans l'ordre de saisie (vide pour les autres types)."
  fields: [ConnectionField!]!
  "postgres : nom de la base."
  database: String
  "postgres : connexion TLS."
  ssl: Boolean
  "postgres : connexion SSH traversée (tunnel)."
  viaConnection: Connection
  exposure: ConnectionExposure!
  "postgres : transactions en lecture seule."
  readOnly: Boolean!
  "Chaque appel d'outil est soumis à l'approbation d'un humain."
  requireApproval: Boolean!
  "ssh : préfixes de commandes autorisés par les outils (vide = tout)."
  commandAllowlist: [String!]!
  "ssh : clé publique à ajouter dans authorized_keys du serveur."
  publicKey: String
  "ssh : empreinte de la clé d'hôte mémorisée à la première connexion."
  hostFingerprint: String
  hostKeySeenAt: DateTime
  "Un secret (clé privée, mot de passe, champ secret d'un site) est enregistré."
  hasSecret: Boolean!
  lastTestAt: DateTime
  lastTestOk: Boolean
  lastTestError: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

input ConnectionInput {
  name: String
  kind: ConnectionKind
  description: String
  host: String
  port: Int
  username: String
  database: String
  ssl: Boolean
  viaConnectionId: ID
  exposure: ConnectionExposure
  readOnly: Boolean
  requireApproval: Boolean
  commandAllowlist: [String!]
  "ssh : clé privée à importer (sinon une paire est générée à la création et la clé privée ne quitte jamais le serveur)."
  privateKey: String
  "postgres : mot de passe (chaîne vide pour l'effacer)."
  password: String
  "website : adresse du site."
  url: String
  "website : liste complète des champs (remplace la précédente)."
  fields: [ConnectionFieldInput!]
}

input ConnectionFieldInput {
  key: String!
  label: String
  "Secret : chiffré, jamais renvoyé, saisi par le navigateur à la place de l'agent. Défaut : false (ou inchangé en mise à jour)."
  secret: Boolean
  "Valeur. Pour un secret existant, absente ou null = inchangée."
  value: String
}

type ConnectionTest {
  connection: Connection!
  ok: Boolean!
  error: String
  "Réponse de la cible (système, version de PostgreSQL...)."
  detail: String
}

# ---- Explorateur de fichiers ---------------------------------------------------------------------

"Entrée d'un dossier du workspace (checkout principal ou worktree)."
type FileEntry {
  name: String!
  "Chemin relatif à la racine du workspace, séparateur /."
  path: String!
  "dir, file, symlink ou other."
  kind: String!
  size: Int
  modifiedAt: DateTime
}

type FileContent {
  path: String!
  name: String!
  size: Int!
  modifiedAt: DateTime!
  "true si le fichier semble binaire : content est alors null."
  binary: Boolean!
  content: String
}

enum FileEntryKind {
  dir
  file
}

type GitCommit {
  hash: String!
  shortHash: String!
  subject: String!
  author: String!
  date: DateTime!
}

"Fichier modifié dans un workspace ou un worktree (statuts git : M, A, D, R, ?, U...)."
type GitFileChange {
  path: String!
  origPath: String
  indexStatus: String!
  worktreeStatus: String!
  staged: Boolean!
  unstaged: Boolean!
  untracked: Boolean!
  conflicted: Boolean!
}

type GitStatus {
  branch: String
  upstream: String
  ahead: Int!
  behind: Int!
  detached: Boolean!
  changes: [GitFileChange!]!
  headCommit: GitCommit
}

type GitBranch {
  name: String!
  current: Boolean!
  remote: Boolean!
  upstream: String
  commit: GitCommit
}

type GitDiff {
  "Chemin du fichier, ou hash pour un commit."
  path: String!
  staged: Boolean!
  "Diff unifié."
  text: String!
  binary: Boolean!
  truncated: Boolean!
}

"État de l'environnement d'exécution d'un projet."
type RunnerStatus {
  kind: String!
  ready: Boolean!
  "running, stopped, absent, unavailable..."
  state: String!
  containerName: String
  image: String
  memory: String
  cpus: String
  startedAt: DateTime
  error: String
}

type WorkspaceGit {
  branch: String!
  commit: String!
}

enum PullRequestState {
  OPEN
  CLOSED
  MERGED
}

"Filtre de la liste des pull requests."
enum PullRequestFilter {
  OPEN
  CLOSED
  MERGED
  ALL
}

enum PullRequestMergeMethod {
  MERGE
  SQUASH
  REBASE
}

"Check (GitHub Actions, statut externe) du dernier commit d'une pull request."
type PullRequestCheck {
  name: String!
  "SUCCESS, FAILURE, PENDING, NEUTRAL, SKIPPED"
  state: String!
  url: String
}

"Dernière revue d'un relecteur."
type PullRequestReview {
  author: String!
  "APPROVED, CHANGES_REQUESTED, COMMENTED, DISMISSED, PENDING"
  state: String!
}

"Pull request GitHub du dépôt d'un projet (lue avec le jeton de la connexion GitHub)."
type PullRequest {
  number: Int!
  title: String!
  body: String!
  url: String!
  state: PullRequestState!
  isDraft: Boolean!
  author: String
  authorAvatarUrl: String
  headRefName: String!
  baseRefName: String!
  "Branche d'un fork : pas de nettoyage possible."
  isCrossRepository: Boolean!
  "MERGEABLE, CONFLICTING ou UNKNOWN (calcul en cours chez GitHub)."
  mergeable: String!
  "CLEAN, BLOCKED, BEHIND, DIRTY, UNSTABLE, HAS_HOOKS, DRAFT, UNKNOWN"
  mergeStateStatus: String!
  "APPROVED, CHANGES_REQUESTED, REVIEW_REQUIRED, ou null (pas de revue exigée)."
  reviewDecision: String
  "État agrégé des checks du dernier commit : SUCCESS, FAILURE, PENDING, ERROR, EXPECTED, ou null (aucun check)."
  checksState: String
  checks: [PullRequestCheck!]!
  reviews: [PullRequestReview!]!
  additions: Int!
  deletions: Int!
  changedFiles: Int!
  commitCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  mergedAt: DateTime
  closedAt: DateTime
  "Worktree du projet sur la branche de la PR, s'il existe."
  worktree: Worktree
  "Tâches du projet traitées sur la branche de la PR."
  tasks: [Task!]!
}

"Proposition de pull request pour la branche courante d'un workspace."
type PullRequestDraft {
  branch: String!
  base: String!
  "Titre proposé : tâche liée à la branche, sinon commit unique, sinon nom de la branche."
  title: String!
  "Description proposée : tâche et liste des commits."
  body: String!
  commits: [GitCommitRef!]!
  "La branche n'a pas de branche distante : la création la poussera."
  needsPush: Boolean!
  "Pull request déjà ouverte pour cette branche."
  existing: PullRequest
}

type GitCommitRef {
  hash: String!
  subject: String!
}

"Résultat d'une fusion et du nettoyage demandé."
type MergePullRequestResult {
  pullRequest: PullRequest!
  "Commit de fusion."
  sha: String
  deletedWorktreeIds: [ID!]!
  completedTaskIds: [ID!]!
  "Étapes de nettoyage non réalisées, avec leur raison."
  warnings: [String!]!
}

input MergePullRequestCleanup {
  "Supprime la branche sur GitHub."
  deleteRemoteBranch: Boolean = true
  "Supprime le(s) worktree(s) de la branche et la branche locale."
  deleteWorktree: Boolean = true
  "Arrête les sessions encore ouvertes dans ces worktrees (sinon ils sont conservés). Leur historique est gardé."
  stopSessions: Boolean = false
  "Passe à « terminée » les tâches ouvertes traitées sur cette branche."
  completeTasks: Boolean = true
}

"Niveau d'accès des agents à un service Google : NONE, READ (lire, chercher) ou WRITE (aussi envoyer / déposer)."
enum GoogleAccess {
  NONE
  READ
  WRITE
}

"Compte Google relié à un projet par OAuth (plusieurs par projet) : les agents accèdent à sa messagerie et/ou à son Drive via le serveur MCP `google`. Le rattachement se fait par GET /auth/google/connect?projectId=…&gmail=…&drive=…[&accountId=… pour remplacer un compte] ; les jetons ne sont jamais renvoyés."
type GoogleAccount {
  id: ID!
  email: String!
  name: String
  avatarUrl: String
  gmailAccess: GoogleAccess!
  driveAccess: GoogleAccess!
  "Portées OAuth accordées par Google."
  scopes: [String!]!
  connectedBy: User
  lastCheckAt: DateTime
  lastCheckOk: Boolean
  lastCheckError: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type GoogleAccountCheck {
  account: GoogleAccount!
  ok: Boolean!
  error: String
  "Ce que Google a répondu (adresse, nombre de messages, espace Drive)."
  detail: String
}

type Session {
  id: ID!
  project: Project!
  "Worktree dans lequel la session s'exécute (null : checkout principal)."
  worktree: Worktree
  "Session d'agent qui a lancé celle-ci (outil MCP sessions.create) ; null pour une session lancée par un humain."
  parentSession: Session
  "Sessions lancées par l'agent de cette session."
  childSessions: [Session!]!
  name: String!
  provider: String!
  status: SessionStatus!
  activity: SessionActivity
  "Première instruction de la session."
  prompt: String
  "Fichiers joints à la première instruction."
  promptAttachments: [Attachment!]!
  config: JSON!
  externalId: String
  exitCode: Int
  error: String
  "Coût estimé cumulé de la session (USD, tarif API)."
  costUsd: Float!
  createdAt: DateTime!
  updatedAt: DateTime!
  startedAt: DateTime
  endedAt: DateTime
  "Événements journalisés, dans l'ordre chronologique. `after` = id du dernier événement déjà reçu."
  events(after: ID, limit: Int): [SessionEvent!]!
  requests(status: RequestStatus): [Request!]!
  "Nombre de demandes en attente d'une réponse humaine."
  pendingRequestCount: Int!
  "Le navigateur headless de la session est ouvert et l'agent s'en est servi : vue en direct sur le WebSocket /browsers/<id>."
  browserActive: Boolean!
}

enum RequestStatus {
  PENDING
  ANSWERED
  CANCELLED
  EXPIRED
}

"Demande d'intervention humaine émise par un agent : autorisation d'outil, question, saisie..."
type Request {
  id: ID!
  session: Session!
  "'permission', 'question', 'input', ... (extensible)"
  type: String!
  status: RequestStatus!
  title: String!
  message: String
  "Données propres au type : { toolName, input, suggestions } pour 'permission', { questions } pour 'question'."
  payload: JSON!
  "Réponse fournie : { decision: allow|deny, always?, message? } pour 'permission', { answers: { question: réponse } } pour 'question'."
  response: JSON
  createdAt: DateTime!
  answeredAt: DateTime
}

"Fichier joint à une instruction ; téléchargeable sur GET /api/attachments/<session>/<id> (cookie de session)."
type Attachment {
  id: ID!
  name: String!
  mediaType: String!
  size: Int!
}

type SessionEvent {
  id: ID!
  sessionId: ID!
  type: String!
  payload: JSON!
  createdAt: DateTime!
}

# ---- Paramètres généraux ---------------------------------------------------------------------

"Comment le serveur s'authentifie auprès de Claude : compte de l'utilisateur système (server), jeton OAuth obtenu depuis l'interface (oauth), ou clé API (api_key)."
enum ClaudeAuthMode {
  server
  oauth
  api_key
}

type ClaudeAccount {
  email: String
  organization: String
  subscriptionType: String
  apiProvider: String
}

"Modèle connu de Claude Code : alias ou identifiant complet, et l'identifiant réel vers lequel il pointe."
type ClaudeModel {
  value: String!
  resolvedModel: String
  displayName: String!
  description: String!
}

"Dernière vérification de connexion : compte lu et modèles disponibles."
type ClaudeVerification {
  verifiedAt: DateTime!
  authMode: ClaudeAuthMode!
  ok: Boolean!
  error: String
  account: ClaudeAccount
  models: [ClaudeModel!]!
}

"Compte connecté dans le magasin du CLI de l'utilisateur système (mode server), d'après `claude auth status`."
