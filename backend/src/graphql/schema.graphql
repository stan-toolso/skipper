  "Santé du serveur (administrateurs de l'application)."
  serverHealth: ServerHealth!
  "Une connexion Claude lancée par la personne connectée."
  claudeLogin(id: ID!): ClaudeLogin!
  "Dépôts GitHub accessibles avec les comptes de la personne connectée (les plus récents d'abord)."
  githubRepositories(query: String): [GithubRepository!]!
  "Services qu'un jeton applicatif du coffre peut servir."
  vaultTokenServices: [VaultTokenService!]!
  "Types de session, avec les formulaires adaptés aux réglages de la personne connectée."
  providers: [Provider!]!
  # ---- Agents et workflows ------------------------------------------------------------------
  "Agents d'un projet, ou de tous les projets accessibles."
