scalar JSON
scalar DateTime

enum SessionStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  STOPPED
  INTERRUPTED
}

type ConfigOption {
  value: String!
  label: String!
  description: String
}

type ConfigField {
  key: String!
  label: String!
  type: String!
  required: Boolean!
  description: String
  options: [ConfigOption!]
  defaultValue: String
  "Affiché dans la section « Options avancées »."
  advanced: Boolean
}

"Un type d'agent que l'on peut exécuter en session (Claude, shell, ...)."
type Provider {
  type: String!
  label: String!
  description: String!
  "true si l'on peut envoyer des instructions à une session en cours."
  interactive: Boolean!
  configFields: [ConfigField!]!
}

"Pour une session en cours : l'agent travaille ou attend des instructions."
enum SessionActivity {
  BUSY
  IDLE
}

# ---- Utilisateurs et accès ----------------------------------------------------------------------

"Rôle d'un utilisateur sur un projet : ADMIN gère le projet et ses membres, MEMBER lance sessions et terminaux, VIEWER consulte seulement."
enum ProjectRole {
  ADMIN
  MEMBER
  VIEWER
}

"Utilisateur de l'application (connexion Google). Il n'existe que s'il a été invité sur un projet."
type User {
  id: ID!
  email: String!
  name: String!
  avatarUrl: String
  "Administrateur de l'application : accès aux paramètres généraux."
  isAdmin: Boolean!
  createdAt: DateTime!
  "Null tant que l'utilisateur ne s'est jamais connecté."
  lastLoginAt: DateTime
}

"Appartenance d'un utilisateur à un projet."
type ProjectMember {
  user: User!
  role: ProjectRole!
  invitedBy: User
  createdAt: DateTime!
  "Invité mais jamais connecté."
  pending: Boolean!
}

"Un projet regroupe des sessions ; chacune s'exécute dans le workspace du projet."
type Project {
  id: ID!
  name: String!
  "Nom du dossier du projet dans WORKSPACES_ROOT (fixé à la création)."
  slug: String!
  description: String
  "Ajouté au prompt système des agents qui le supportent."
  systemPrompt: String!
  gitUrl: String
  gitBranch: String
  "Réglages du conteneur Docker du projet : { image, memory, cpus, browser }."
  runnerConfig: JSON!
  runnerStatus: RunnerStatus!
  "Chemin absolu du workspace sur le serveur."
  workspacePath: String!
  workspaceExists: Boolean!
  "Branche et commit courants du workspace, si c'est un dépôt git."
  git: WorkspaceGit
  createdAt: DateTime!
  updatedAt: DateTime!
  sessions(status: SessionStatus, limit: Int, offset: Int): [Session!]!
  "Bibliothèque de contexte : dossiers et instructions à plat, avec leur chemin."
  contextFolders: [ContextFolder!]!
  contextInstructions: [ContextInstruction!]!
  contextChanges(limit: Int): [ContextChange!]!
  terminals: [Terminal!]!
  tasks(status: [TaskStatus!]): [Task!]!
  worktrees: [Worktree!]!
  connections: [Connection!]!
  members: [ProjectMember!]!
  "Rôle de l'utilisateur connecté sur ce projet."
  myRole: ProjectRole!
  "Autorisations d'outils mémorisées pour le projet (« ne plus demander dans ce projet »)."
  permissionRules: [PermissionRule!]!
}

"Règle d'autorisation d'outil mémorisée pour un projet, au format des permissions Claude Code (Read, Bash(git status:*)...)."
type PermissionRule {
  id: ID!
  projectId: ID!
  toolName: String!
  "Motif propre à l'outil ; null = tout l'outil."
  ruleContent: String
  "Forme textuelle : toolName ou toolName(ruleContent)."
  rule: String!
  "Session pendant laquelle la règle a été mémorisée, le cas échéant."
  createdBySession: Session
  createdAt: DateTime!
}

"Dossier de la bibliothèque de contexte d'un projet."
type ContextFolder {
  id: ID!
  projectId: ID!
  parentId: ID
  name: String!
  slug: String!
  "Chemin de slugs depuis la racine, ex. \"api/auth\"."
  path: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Instruction (document Markdown) de la bibliothèque de contexte, versionnée."
type ContextInstruction {
  id: ID!
  projectId: ID!
  folderId: ID
  name: String!
  slug: String!
  path: String!
  description: String!
  content: String!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  versions: [ContextInstructionVersion!]!
}

type ContextInstructionVersion {
  id: ID!
  version: Int!
  name: String!
  description: String!
  content: String!
  changeNote: String
  "'human' (interface) ou 'agent' (session)."
  authorType: String!
  authorSession: Session
  createdAt: DateTime!
}

"Entrée du journal des modifications du contexte d'un projet."
type ContextChange {
  id: ID!
  "folder.create, folder.rename, folder.move, folder.delete, instruction.create, instruction.update, instruction.move, instruction.delete, instruction.restore"
  kind: String!
  path: String!
  details: JSON!
  authorType: String!
  authorSession: Session
  createdAt: DateTime!
}

enum TaskStatus {
  TODO
  IN_PROGRESS
  DONE
  CANCELLED
}

enum TaskPriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

"Tâche d'un projet, avec priorité. Créée et mise à jour par les humains ou les agents (outils MCP `tasks`)."
type Task {
  id: ID!
  project: Project!
  title: String!
  description: String!
  status: TaskStatus!
  priority: TaskPriority!
  "Session d'agent qui s'en occupe, le cas échéant."
  session: Session
  "'human' ou 'agent'."
  createdByType: String!
  createdBySession: Session
  "Échéance AAAA-MM-JJ."
  dueDate: String
  createdAt: DateTime!
  updatedAt: DateTime!
  completedAt: DateTime
}

input CreateTaskInput {
  projectId: ID!
  title: String!
  description: String
  priority: TaskPriority
  status: TaskStatus
  dueDate: String
}

input UpdateTaskInput {
  title: String
  description: String
  priority: TaskPriority
  status: TaskStatus
  "Session assignée (null pour retirer)."
  sessionId: ID
  dueDate: String
}

"Notification affichée dans la cloche de l'interface."
type Notification {
  id: ID!
  "request.created, task.created, task.completed, session.completed, session.failed, context.created"
  type: String!
  title: String!
  message: String
  "Chemin dans l'application vers l'élément concerné."
  link: String
  project: Project
  session: Session
  payload: JSON!
  readAt: DateTime
  createdAt: DateTime!
}

enum TerminalStatus {
  RUNNING
  CLOSED
}

"Terminal web : un shell interactif lancé dans le workspace du projet, relié par WebSocket (/terminals/<id>)."
type Terminal {
  id: ID!
  project: Project!
  worktree: Worktree
  name: String!
  status: TerminalStatus!
  exitCode: Int
  createdAt: DateTime!
  closedAt: DateTime
}

"Worktree git d'un projet : une branche extraite dans son propre dossier, à côté du checkout principal."
type Worktree {
  id: ID!
  project: Project!
  "Nom du dossier."
  name: String!
  branch: String!
  path: String!
  exists: Boolean!
  git: WorkspaceGit
  createdAt: DateTime!
  sessions: [Session!]!
  terminals: [Terminal!]!
}

# ---- Connexions ------------------------------------------------------------------------------------

"Type de système distant."
enum ConnectionKind {
  ssh
  postgres
}

"Comment les agents accèdent à la connexion : outils MCP (le serveur garde les identifiants), shell de la session (ssh, psql), ou les deux."
enum ConnectionExposure {
  mcp
  direct
  both
}

"Connexion d'un projet vers un système externe (serveur SSH, base PostgreSQL), utilisable par les agents. Les secrets ne sont jamais renvoyés."
type Connection {
  id: ID!
  project: Project!
  "Nom court employé par les agents (ex. prod, rds-prod)."
  name: String!
  kind: ConnectionKind!
  description: String!
  host: String!
  port: Int!
  username: String!
  "postgres : nom de la base."
  database: String
  "postgres : connexion TLS."
  ssl: Boolean
  "postgres : connexion SSH traversée (tunnel)."
  viaConnection: Connection
  exposure: ConnectionExposure!
  "postgres : transactions en lecture seule."
  readOnly: Boolean!
  "Chaque appel d'outil est soumis à l'approbation d'un humain."
  requireApproval: Boolean!
  "ssh : préfixes de commandes autorisés par les outils (vide = tout)."
  commandAllowlist: [String!]!
  "ssh : clé publique à ajouter dans authorized_keys du serveur."
  publicKey: String
  "ssh : empreinte de la clé d'hôte mémorisée à la première connexion."
  hostFingerprint: String
  hostKeySeenAt: DateTime
  "Un secret (clé privée, mot de passe) est enregistré."
  hasSecret: Boolean!
  lastTestAt: DateTime
  lastTestOk: Boolean
  lastTestError: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

input ConnectionInput {
  name: String
  kind: ConnectionKind
  description: String
  host: String
  port: Int
  username: String
  database: String
  ssl: Boolean
  viaConnectionId: ID
  exposure: ConnectionExposure
  readOnly: Boolean
  requireApproval: Boolean
  commandAllowlist: [String!]
  "ssh : clé privée à importer (sinon une paire est générée à la création et la clé privée ne quitte jamais le serveur)."
  privateKey: String
  "postgres : mot de passe (chaîne vide pour l'effacer)."
  password: String
}

type ConnectionTest {
  connection: Connection!
  ok: Boolean!
  error: String
  "Réponse de la cible (système, version de PostgreSQL...)."
  detail: String
}

# ---- Explorateur de fichiers ---------------------------------------------------------------------

"Entrée d'un dossier du workspace (checkout principal ou worktree)."
type FileEntry {
  name: String!
  "Chemin relatif à la racine du workspace, séparateur /."
  path: String!
  "dir, file, symlink ou other."
  kind: String!
  size: Int
  modifiedAt: DateTime
}

type FileContent {
  path: String!
  name: String!
  size: Int!
  modifiedAt: DateTime!
  "true si le fichier semble binaire : content est alors null."
  binary: Boolean!
  content: String
}

enum FileEntryKind {
  dir
  file
}

type GitCommit {
  hash: String!
  shortHash: String!
  subject: String!
  author: String!
  date: DateTime!
}

"Fichier modifié dans un workspace ou un worktree (statuts git : M, A, D, R, ?, U...)."
type GitFileChange {
  path: String!
  origPath: String
  indexStatus: String!
  worktreeStatus: String!
  staged: Boolean!
  unstaged: Boolean!
  untracked: Boolean!
  conflicted: Boolean!
}

type GitStatus {
  branch: String
  upstream: String
  ahead: Int!
  behind: Int!
  detached: Boolean!
  changes: [GitFileChange!]!
  headCommit: GitCommit
}

type GitBranch {
  name: String!
  current: Boolean!
  remote: Boolean!
  upstream: String
  commit: GitCommit
}

type GitDiff {
  "Chemin du fichier, ou hash pour un commit."
  path: String!
  staged: Boolean!
  "Diff unifié."
  text: String!
  binary: Boolean!
  truncated: Boolean!
}

"État de l'environnement d'exécution d'un projet."
type RunnerStatus {
  kind: String!
  ready: Boolean!
  "running, stopped, absent, unavailable..."
  state: String!
  containerName: String
  image: String
  memory: String
  cpus: String
  startedAt: DateTime
  error: String
}

type WorkspaceGit {
  branch: String!
  commit: String!
}

type Session {
  id: ID!
  project: Project!
  "Worktree dans lequel la session s'exécute (null : checkout principal)."
  worktree: Worktree
  name: String!
  provider: String!
  status: SessionStatus!
  activity: SessionActivity
  "Première instruction de la session."
  prompt: String
  config: JSON!
  externalId: String
  exitCode: Int
  error: String
  createdAt: DateTime!
  updatedAt: DateTime!
  startedAt: DateTime
  endedAt: DateTime
  "Événements journalisés, dans l'ordre chronologique. `after` = id du dernier événement déjà reçu."
  events(after: ID, limit: Int): [SessionEvent!]!
  requests(status: RequestStatus): [Request!]!
  "Nombre de demandes en attente d'une réponse humaine."
  pendingRequestCount: Int!
}

enum RequestStatus {
  PENDING
  ANSWERED
  CANCELLED
  EXPIRED
}

"Demande d'intervention humaine émise par un agent : autorisation d'outil, question, saisie..."
type Request {
  id: ID!
  session: Session!
  "'permission', 'question', 'input', ... (extensible)"
  type: String!
  status: RequestStatus!
  title: String!
  message: String
  "Données propres au type : { toolName, input, suggestions } pour 'permission', { questions } pour 'question'."
  payload: JSON!
  "Réponse fournie : { decision: allow|deny, always?, message? } pour 'permission', { answers: { question: réponse } } pour 'question'."
  response: JSON
  createdAt: DateTime!
  answeredAt: DateTime
}

type SessionEvent {
  id: ID!
  sessionId: ID!
  type: String!
  payload: JSON!
  createdAt: DateTime!
}

# ---- Paramètres généraux ---------------------------------------------------------------------

"Comment le serveur s'authentifie auprès de Claude : compte de l'utilisateur système (server), jeton OAuth obtenu depuis l'interface (oauth), ou clé API (api_key)."
enum ClaudeAuthMode {
  server
  oauth
  api_key
}

type ClaudeAccount {
  email: String
  organization: String
  subscriptionType: String
  apiProvider: String
}

"Modèle connu de Claude Code : alias ou identifiant complet, et l'identifiant réel vers lequel il pointe."
type ClaudeModel {
  value: String!
  resolvedModel: String
  displayName: String!
  description: String!
}

"Dernière vérification de connexion : compte lu et modèles disponibles."
type ClaudeVerification {
  verifiedAt: DateTime!
  authMode: ClaudeAuthMode!
  ok: Boolean!
  error: String
  account: ClaudeAccount
  models: [ClaudeModel!]!
}

"Compte connecté dans le magasin du CLI de l'utilisateur système (mode server), d'après `claude auth status`."
type ServerAuthStatus {
  loggedIn: Boolean!
  "claude.ai (abonnement) ou console (facturation API)."
  authMethod: String
  email: String
  organization: String
  subscriptionType: String
  error: String
}

"Parcours de connexion : oauth = jeton longue durée stocké par Skipper (claude setup-token) ; server = identifiants rangés par le CLI pour l'utilisateur système (claude auth login)."
enum ClaudeLoginKind {
  oauth
  server
}

type ClaudeAuthStatus {
  mode: ClaudeAuthMode!
  server: ServerAuthStatus!
  hasOauthToken: Boolean!
  oauthTokenSetAt: DateTime
  hasApiKey: Boolean!
  "Derniers caractères de la clé API enregistrée."
  apiKeyHint: String
  apiKeySetAt: DateTime
  "Le processus serveur a lui-même ANTHROPIC_API_KEY ou CLAUDE_CODE_OAUTH_TOKEN dans son environnement."
  serverHasApiKey: Boolean!
  verification: ClaudeVerification
}

type ClaudeSettings {
  authMode: ClaudeAuthMode!
  "Modèle des sessions qui n'en précisent pas ; null = défaut de Claude Code."
  defaultModel: String
  "Modèles proposés à la création d'une session ; vide = tous."
  allowedModels: [String!]!
  fallbackModel: String
  "Plafond de dépense estimée sur le mois calendaire, toutes sessions confondues (USD)."
  monthlyBudgetUsd: Float
  "Budget par défaut d'une session (USD)."
  sessionBudgetUsd: Float
  defaultMaxTurns: Int
}

type UsageByModel {
  model: String!
  usd: Float!
}

type UsageBySession {
  sessionId: ID
  sessionName: String
  projectName: String
  usd: Float!
}

"Consommation estimée (d'après total_cost_usd du SDK : une estimation au tarif API, pas une facture)."
type UsageSummary {
  monthStart: DateTime!
  monthUsd: Float!
  totalUsd: Float!
  byModel: [UsageByModel!]!
  bySession: [UsageBySession!]!
}

"Connexion GitHub en cours (device flow) : saisir userCode sur verificationUri."
type GithubLogin {
  id: ID!
  userCode: String!
  verificationUri: String!
  expiresAt: DateTime!
  intervalSeconds: Int!
  "pending, done, failed, expired, cancelled"
  status: String!
  error: String
  createdAt: DateTime!
}

type GithubAuthStatus {
  "Identifiant (public) de l'OAuth App GitHub utilisée pour la connexion."
  clientId: String
  "'env' (GITHUB_CLIENT_ID), 'settings' (saisi dans l'interface) ou null."
  clientIdSource: String
  connected: Boolean!
  "'pat' (jeton personnel) ou 'oauth' (device flow)."
  method: String
  login: String
  avatarUrl: String
  scopes: [String!]!
  tokenSetAt: DateTime
  currentLogin: GithubLogin
}

type GithubRepository {
  fullName: String!
  name: String!
  owner: String!
  description: String
  private: Boolean!
  defaultBranch: String!
  cloneUrl: String!
  htmlUrl: String!
  pushedAt: DateTime
}

type AppSettings {
  claude: ClaudeSettings!
  claudeAuth: ClaudeAuthStatus!
  github: GithubAuthStatus!
  "Modèles connus (dernière vérification, sinon liste de base)."
  models: [ClaudeModel!]!
  usage: UsageSummary!
}

"Connexion OAuth en cours : ouvrir `url`, autoriser, puis fournir le code via completeClaudeLogin."
type ClaudeLogin {
  id: ID!
  kind: ClaudeLoginKind!
  url: String!
  "starting, awaiting_code, exchanging, done, failed"
  status: String!
  error: String
  createdAt: DateTime!
}

input ClaudeSettingsInput {
  authMode: ClaudeAuthMode
  defaultModel: String
  allowedModels: [String!]
  fallbackModel: String
  monthlyBudgetUsd: Float
  sessionBudgetUsd: Float
  defaultMaxTurns: Int
}

type Query {
  "Utilisateur connecté (null sinon). Seule requête accessible sans session."
  me: User
  "Tous les utilisateurs (administrateurs de l'application)."
  users: [User!]!
  "Contenu d'un dossier du workspace du projet (ou du worktree). path vide = racine."
  workspaceEntries(projectId: ID!, worktreeId: ID, path: String = ""): [FileEntry!]!
  "Lecture d'un fichier texte (2 Mo maximum)."
  workspaceFile(projectId: ID!, worktreeId: ID, path: String!): FileContent!
  settings: AppSettings!
  claudeLogin(id: ID!): ClaudeLogin!
  "Dépôts GitHub accessibles avec la connexion GitHub (les plus récents d'abord)."
  githubRepositories(query: String): [GithubRepository!]!
  providers: [Provider!]!
  sessions(projectId: ID, status: SessionStatus, provider: String, limit: Int, offset: Int): [Session!]!
  session(id: ID!): Session
  projects: [Project!]!
  project(id: ID!): Project
  "Demandes, toutes sessions confondues. `status` à null renvoie tout l'historique (par défaut : celles en attente)."
  requests(status: RequestStatus = PENDING, sessionId: ID, limit: Int, newestFirst: Boolean = false): [Request!]!
  request(id: ID!): Request
  terminal(id: ID!): Terminal
  worktree(id: ID!): Worktree
  connection(id: ID!): Connection
  "Suivi git d'un workspace (checkout principal) ou d'un worktree."
  gitStatus(projectId: ID!, worktreeId: ID): GitStatus!
  gitDiff(projectId: ID!, worktreeId: ID, path: String!, staged: Boolean = false): GitDiff!
  gitCommitDiff(projectId: ID!, worktreeId: ID, hash: String!): GitDiff!
  gitBranches(projectId: ID!, worktreeId: ID): [GitBranch!]!
  gitLog(projectId: ID!, worktreeId: ID, limit: Int): [GitCommit!]!
  notifications(unreadOnly: Boolean = false, limit: Int): [Notification!]!
  unreadNotificationCount: Int!
  "Tâches, tous projets confondus (par défaut : ouvertes)."
  tasks(projectId: ID, status: [TaskStatus!], priority: TaskPriority, limit: Int): [Task!]!
  task(id: ID!): Task
  contextInstruction(id: ID!): ContextInstruction
  searchContext(projectId: ID!, query: String!): [ContextInstruction!]!
}

input CreateContextInstructionInput {
  projectId: ID!
  folderId: ID
  name: String!
  description: String
  content: String
  changeNote: String
}

input UpdateContextInstructionInput {
  name: String
  description: String
  content: String
  "Dossier cible (null = racine) pour déplacer l'instruction."
  folderId: ID
  changeNote: String
}

input CreateProjectInput {
  name: String!
  "Optionnel : dérivé du nom si absent."
  slug: String
  description: String
  systemPrompt: String
  gitUrl: String
  gitBranch: String
  runnerConfig: JSON
}

input UpdateProjectInput {
  name: String
  description: String
  systemPrompt: String
  gitUrl: String
  gitBranch: String
  runnerConfig: JSON
}

input CreateSessionInput {
  projectId: ID!
  worktreeId: ID
  name: String!
  provider: String!
  prompt: String
  config: JSON
  "Démarre la session immédiatement après création (défaut : true)."
  autoStart: Boolean
}

type Mutation {
  "Écrit un fichier. Avec expectedModifiedAt, refuse (FILE_CONFLICT) si le fichier a changé depuis."
  writeWorkspaceFile(projectId: ID!, worktreeId: ID, path: String!, content: String!, expectedModifiedAt: DateTime): FileContent!
  createWorkspaceEntry(projectId: ID!, worktreeId: ID, path: String!, kind: FileEntryKind!): FileEntry!
  renameWorkspaceEntry(projectId: ID!, worktreeId: ID, path: String!, newPath: String!): FileEntry!
  "Supprime un fichier ou un dossier (récursivement)."
  deleteWorkspaceEntry(projectId: ID!, worktreeId: ID, path: String!): Boolean!

  "Met à jour les réglages Claude (les champs absents sont inchangés ; null efface)."
  updateClaudeSettings(input: ClaudeSettingsInput!): AppSettings!
  "Enregistre (chiffrée) la clé API Anthropic ; null la supprime."
  setClaudeApiKey(apiKey: String): AppSettings!
  "Supprime le jeton OAuth enregistré."
  clearClaudeOauthToken: AppSettings!
  "Lance la connexion : renvoie l'URL d'autorisation à ouvrir."
  startClaudeLogin(kind: ClaudeLoginKind = oauth): ClaudeLogin!
  "GitHub : enregistre l'identifiant de l'OAuth App (null pour effacer)."
  setGithubClientId(clientId: String): AppSettings!
  "GitHub : enregistre un jeton d'accès personnel après vérification auprès de GitHub."
  setGithubPersonalToken(token: String!): AppSettings!
  "GitHub : démarre la connexion par device flow."
  startGithubLogin: GithubLogin!
  cancelGithubLogin: AppSettings!
  "GitHub : oublie le jeton."
  disconnectGithub: AppSettings!
  "Transmet le code d'autorisation ; en cas de succès le mode passe à celui du parcours (oauth ou server)."
  completeClaudeLogin(id: ID!, code: String!): ClaudeLogin!
  "Déconnecte le compte du serveur (claude auth logout)."
  logoutServerClaude: AppSettings!
  cancelClaudeLogin(id: ID!): Boolean!
  "Interroge Claude Code avec l'authentification du mode indiqué (défaut : mode courant) : compte et modèles."
  verifyClaudeAuth(mode: ClaudeAuthMode): AppSettings!

  "Invite un e-mail sur le projet (l'utilisateur est créé s'il n'existe pas) ou change son rôle. Réservé aux administrateurs du projet."
  inviteProjectMember(projectId: ID!, email: String!, role: ProjectRole = MEMBER): ProjectMember!
  updateProjectMemberRole(projectId: ID!, userId: ID!, role: ProjectRole!): ProjectMember!
  removeProjectMember(projectId: ID!, userId: ID!): Boolean!
  "Ajoute une autorisation mémorisée au projet (membres). ruleContent vide = tout l'outil."
  addProjectPermissionRule(projectId: ID!, toolName: String!, ruleContent: String): PermissionRule!
  "Retire une autorisation mémorisée : les prochaines sessions redemanderont."
  deleteProjectPermissionRule(id: ID!): Boolean!

  "Crée le projet et prépare son workspace (clone git si une URL est fournie). Le créateur en devient administrateur."
  createProject(input: CreateProjectInput!): Project!
  updateProject(id: ID!, input: UpdateProjectInput!): Project!
  "(Re)crée le workspace s'il n'existe pas sur disque."
  prepareProjectWorkspace(id: ID!): Project!
  "Démarre l'environnement d'exécution (conteneur) du projet."
  startProjectRunner(id: ID!): Project!
  "Arrête l'environnement d'exécution ; les sessions en cours sont interrompues."
  stopProjectRunner(id: ID!): Project!
  "Supprime le conteneur (pour repartir d'une image à jour) ; les fichiers sont conservés."
  resetProjectRunner(id: ID!): Project!
  "Supprime le projet et tout ce qui en dépend : sessions, terminaux, worktrees, conteneur, dossier de travail. Irréversible."
  deleteProject(id: ID!): Boolean!
  createSession(input: CreateSessionInput!): Session!
  startSession(id: ID!): Session!
  "Arrêt immédiat de la session (abandon du travail en cours)."
  stopSession(id: ID!): Session!
  deleteSession(id: ID!): Boolean!
  "Envoie une instruction : transmise à l'agent si la session est en cours, sinon relance la session avec cette instruction."
  sendSessionMessage(id: ID!, text: String!): Session!
  "Fin propre : l'agent termine son tour, puis la session se termine."
  endSession(id: ID!): Session!
  "Interrompt le tour en cours ; la session reste ouverte aux instructions."
  interruptSession(id: ID!): Session!
  "Répond à une demande en attente ; la session reprend avec cette réponse."
  answerRequest(id: ID!, response: JSON!): Request!
  "Abandonne une demande : l'agent reçoit un refus."
  cancelRequest(id: ID!): Request!

  markNotificationRead(id: ID!): Notification!
  "Renvoie le nombre de notifications marquées."
  markAllNotificationsRead: Int!
  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  deleteTask(id: ID!): Boolean!
  "Confie la tâche à un agent. Sans worktreeId, un worktree dédié (task/<slug>) est créé si le projet est relié à git, sauf dedicatedWorktree: false (dossier principal)."
  startTaskSession(id: ID!, provider: String, config: JSON, worktreeId: ID, dedicatedWorktree: Boolean = true): Session!

  "git add (paths vide = tout)."
  gitStage(projectId: ID!, worktreeId: ID, paths: [String!]!): GitStatus!
  "git reset (paths vide = tout)."
  gitUnstage(projectId: ID!, worktreeId: ID, paths: [String!]!): GitStatus!
  "Abandonne les modifications non indexées ; supprime un fichier non suivi."
  gitDiscard(projectId: ID!, worktreeId: ID, paths: [String!]!): GitStatus!
  gitCommit(projectId: ID!, worktreeId: ID, message: String!, stageAll: Boolean = false): GitStatus!
  gitFetch(projectId: ID!, worktreeId: ID): GitStatus!
  gitPull(projectId: ID!, worktreeId: ID): GitStatus!
  gitPush(projectId: ID!, worktreeId: ID): GitStatus!
  "Bascule sur une branche (locale ou origin/...) ; create = nouvelle branche depuis HEAD."
  gitCheckout(projectId: ID!, worktreeId: ID, branch: String!, create: Boolean = false): GitStatus!

  "Ouvre un shell dans le workspace du projet (ou dans un worktree)."
  createTerminal(projectId: ID!, name: String, worktreeId: ID): Terminal!
  "Crée un worktree git : extrait la branche si elle existe, sinon la crée depuis baseRef (défaut : HEAD du checkout principal)."
  createWorktree(projectId: ID!, branch: String!, name: String, baseRef: String): Worktree!
  "Supprime le worktree et tout ce qui y est rattaché (sessions arrêtées, terminaux fermés, dossier) ; la branche est conservée sauf deleteBranch."
  deleteWorktree(id: ID!, deleteBranch: Boolean = false): Boolean!
  "Crée une connexion ; pour ssh sans privateKey, génère une paire de clés (la clé publique est à installer sur le serveur)."
  createConnection(projectId: ID!, input: ConnectionInput!): Connection!
  "Met à jour une connexion (les champs absents sont inchangés)."
  updateConnection(id: ID!, input: ConnectionInput!): Connection!
  deleteConnection(id: ID!): Boolean!
  "Vérifie la connexion depuis le serveur ; mémorise la clé d'hôte SSH à la première réussite."
  testConnection(id: ID!): ConnectionTest!
  "ssh : nouvelle paire de clés (l'ancienne clé publique est à retirer du serveur)."
  regenerateConnectionKey(id: ID!): Connection!
  "ssh : oublie la clé d'hôte mémorisée (serveur réinstallé)."
  forgetConnectionHostKey(id: ID!): Connection!
  "Termine le shell."
  closeTerminal(id: ID!): Terminal!
  deleteTerminal(id: ID!): Boolean!

  createContextFolder(projectId: ID!, parentId: ID, name: String!): ContextFolder!
  renameContextFolder(id: ID!, name: String!): ContextFolder!
  moveContextFolder(id: ID!, parentId: ID): ContextFolder!
  "Supprime le dossier et tout son contenu."
  deleteContextFolder(id: ID!): Boolean!
  createContextInstruction(input: CreateContextInstructionInput!): ContextInstruction!
  "Toute modification de nom, description ou contenu crée une nouvelle version."
  updateContextInstruction(id: ID!, input: UpdateContextInstructionInput!): ContextInstruction!
  deleteContextInstruction(id: ID!): Boolean!
  "Restaure une ancienne version (crée une nouvelle version avec son contenu)."
  restoreContextInstructionVersion(id: ID!, version: Int!): ContextInstruction!
}

type Subscription {
  "Flux d'événements d'une session (SSE)."
  sessionEvents(sessionId: ID!): SessionEvent!
  "Notifié à chaque changement d'état d'une session."
  sessionUpdated: Session!
  "Nouvelle demande d'intervention humaine."
  requestCreated: Request!
  "Demande répondue, annulée ou expirée."
  requestUpdated: Request!
  notificationCreated: Notification!
}
