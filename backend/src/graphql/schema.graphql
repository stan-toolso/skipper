# ---- Agents et workflows ---------------------------------------------------------------------

"Statut d'une exécution d'agent ou de workflow ; QUEUED : exécution de workflow déclenchée par un événement, en attente d'une place."
enum RunStatus {
  QUEUED
  PENDING
  RUNNING
  SUCCEEDED
  FAILED
  CANCELLED
}

"Ce qui a lancé l'exécution ; EVENT : un événement du projet (une tâche créée)."
enum RunTrigger {
  MANUAL
  SCHEDULE
  WORKFLOW
  TEST
  EVENT
}

enum AgentOutputFormat {
  TEXT
  JSON
}

"Variable déclarée par un agent ou un workflow, remplie au lancement (disponible comme {{input.<clé>}})."
type InputVariable {
  key: String!
  label: String!
  description: String
  required: Boolean!
  defaultValue: String
}

input InputVariableInput {
  key: String!
  label: String
  description: String
  required: Boolean
  defaultValue: String
}

"Planification d'un agent ou d'un workflow."
type AutomationSchedule {
  cron: String!
  timezone: String!
  enabled: Boolean!
  nextRunAt: DateTime
  lastRunAt: DateTime
  "Issue de la dernière exécution planifiée (une ligne)."
  lastResult: String
}

input AutomationScheduleInput {
  cron: String!
  timezone: String
  enabled: Boolean
}

"""
Un agent : configuration réutilisable et paramétrée. Fournisseur `llm` : appel direct d'un modèle (LiteLLM,
OpenAI ou Anthropic, clé du coffre, trace Langfuse optionnelle) ; sinon un type de session (claude, opencode,
shell) et ses options, chaque exécution étant une session dédiée.
"""
type Agent {
  id: ID!
  project: Project!
  name: String!
  description: String!
  "llm, claude, opencode ou shell."
  provider: String!
  "Réglages du modèle (backend, keyItemId, model, temperature, maxTokens, langfuseItemId) ou de la session (model, permissionMode…)."
  config: JSON!
  "Rôle et consignes : prompt système du modèle, ou ajouté au prompt système du projet dans les sessions."
  systemPrompt: String!
  "Instruction envoyée à chaque exécution ; les {{input.<clé>}} sont remplis par les entrées."
  promptTemplate: String!
  inputs: [InputVariable!]!
  outputFormat: AgentOutputFormat!
  "Forme JSON attendue, montrée à l'agent (sortie JSON seulement)."
  outputSchema: String
  "Worktree où travaillent les exécutions (null : dossier principal)."
  worktree: Worktree
  timeoutMinutes: Int!
  schedule: AutomationSchedule
  "Entrées des exécutions planifiées."
  scheduleInputs: JSON!
  runs(limit: Int): [AgentRun!]!
  lastRun: AgentRun
  "Workflows dont le graphe exécute cet agent."
  workflows: [Workflow!]!
  createdBy: User
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateAgentInput {
  projectId: ID!
  name: String!
  description: String
  provider: String!
  config: JSON
  systemPrompt: String
  promptTemplate: String
  inputs: [InputVariableInput!]
  outputFormat: AgentOutputFormat
  outputSchema: String
  worktreeId: ID
  timeoutMinutes: Int
}

input UpdateAgentInput {
  name: String
  description: String
  provider: String
  config: JSON
  systemPrompt: String
  promptTemplate: String
  inputs: [InputVariableInput!]
  outputFormat: AgentOutputFormat
  outputSchema: String
  worktreeId: ID
  timeoutMinutes: Int
}

"Une exécution d'un agent : sa session, l'instruction rendue, la réponse."
type AgentRun {
  id: ID!
  agent: Agent!
  project: Project!
  session: Session
  workflowRun: WorkflowRun
  "Nœud de l'exécution de workflow (déclencheur workflow)."
  nodeKey: String
  trigger: RunTrigger!
  status: RunStatus!
  inputs: JSON!
  prompt: String!
  output: String
  "La réponse lue comme JSON (format de sortie JSON)."
  outputJson: JSON
  error: String
  costUsd: Float!
  durationMs: Int
  owner: User
  createdAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
}

"Aperçu de l'instruction qu'un agent recevrait."
type AgentPromptPreview {
  inputs: JSON!
  prompt: String!
}

"Éléments du coffre utilisables par la personne pour les agents à appel direct : proxys LiteLLM, projets Langfuse, jetons OpenAI et Anthropic."
type AgentLlmKeys {
  litellm: [VaultItem!]!
  langfuse: [VaultItem!]!
  tokens: [VaultItem!]!
}

"Problème trouvé dans le graphe d'un workflow : les erreurs bloquent les exécutions, pas les avertissements."
type WorkflowIssue {
  nodeKey: String
  edgeId: String
  severity: String!
  message: String!
}

"""
Un workflow : un graphe de nœuds (déclencheur, agent, tâche, session, création de tâche, condition, fin) et
d'arêtes à branches (oui / non, en cas d'erreur), lancé à la main, par planification ou par une tâche créée.
La définition est enregistrée telle que l'éditeur la dessine :
{ nodes: [{ key, type, label, position, … }], edges: [{ id, source, target, sourceHandle? }] }.
"""
type Workflow {
  id: ID!
  project: Project!
  name: String!
  description: String!
  definition: JSON!
  "Un workflow en pause ignore ses exécutions planifiées et ses déclencheurs (les lancements manuels restent possibles)."
  enabled: Boolean!
  "Problèmes du graphe courant."
  issues: [WorkflowIssue!]!
  "Variables d'un déclencheur du workflow ; sans clé, de son déclencheur par défaut (premier manuel, sinon premier)."
  variables(triggerKey: String): [InputVariable!]!
  schedule: AutomationSchedule
  scheduleInputs: JSON!
  "Personne dont les comptes servent aux exécutions déclenchées par un événement (la dernière à avoir enregistré le déclencheur)."
  eventOwner: User
  runs(limit: Int): [WorkflowRun!]!
  lastRun: WorkflowRun
  createdBy: User
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateWorkflowInput {
  projectId: ID!
  name: String!
  description: String
  definition: JSON
  enabled: Boolean
}

input UpdateWorkflowInput {
  name: String
  description: String
  definition: JSON
  enabled: Boolean
}

type WorkflowRun {
  id: ID!
  workflow: Workflow!
  project: Project!
  trigger: RunTrigger!
  "Clé du nœud déclencheur de départ."
  triggerKey: String
  status: RunStatus!
  "Le graphe tel qu'il était au lancement."
  definition: JSON!
  inputs: JSON!
  "Sortie du ou des nœuds de fin atteints."
  output: JSON
  error: String
  costUsd: Float!
  cancelRequested: Boolean!
  nodes: [WorkflowRunNode!]!
  logs(after: ID, limit: Int): [WorkflowRunLog!]!
  owner: User
  createdAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
}

"État d'un nœud dans une exécution."
type WorkflowRunNode {
  id: ID!
  nodeKey: String!
  nodeType: String!
  "pending, running, succeeded, failed, skipped, cancelled."
  status: String!
  input: JSON
  output: JSON
  error: String
  agentRun: AgentRun
  startedAt: DateTime
  finishedAt: DateTime
}

type WorkflowRunLog {
  id: ID!
  nodeKey: String
  "debug, info, warn, error."
  level: String!
  message: String!
  data: JSON
  createdAt: DateTime!
}

