  "Coffre, compte AWS (sso) : une interrogation de la connexion par code ; les jetons sont enregistrés quand l'autorisation est donnée."
  pollAwsLogin(id: ID!): AwsLoginPoll!
  setDefaultGithubAccount(accountId: ID!): AppSettings!
  "GitHub : oublie un compte (tous sans accountId)."
  disconnectGithub(accountId: ID): AppSettings!
  # ---- Workflows ----------------------------------------------------------------------------
  createWorkflow(input: CreateWorkflowInput!): Workflow!
  updateWorkflow(id: ID!, input: UpdateWorkflowInput!): Workflow!
  deleteWorkflow(id: ID!): Boolean!
