  "Statut, note, tâche reliée, déploiement d'une pull request suivie."
  updatePullRequest(id: ID!, input: UpdateTrackedPullRequestInput!): TrackedPullRequest!
  "Cesse de suivre une pull request (la PR GitHub n'est pas touchée)."
  deletePullRequest(id: ID!): Boolean!
  "Rafraîchit tout de suite les pull requests suivies d'un projet depuis GitHub."
  syncPullRequests(projectId: ID!): [TrackedPullRequest!]!
  "Demande à la session rattachée à la PR (TrackedPullRequest.session) de résoudre ses conflits avec la base : l'instruction lui est envoyée (la session est relancée si elle était terminée). Renvoie la session."
  resolvePullRequestConflicts(id: ID!): Session!
  "Fait relire une branche (dossier de travail) ou une PR suivie par un agent : session Claude en lecture seule dans le dossier de la branche, avec le diff par rapport à la base ; son rapport est publié dans le fil de la tâche et, pour une PR ouverte, en commentaire GitHub. Renvoie la session de relecture."
  requestCodeReview(projectId: ID!, worksessionId: ID, pullRequestId: ID): Session!

  "Ouvre un shell dans une work session du projet, avec l'historique des commandes de l'utilisateur sur le projet."
  createTerminal(projectId: ID!, name: String, worksessionId: ID!): Terminal!
  "Crée une work session. Projet git : extrait la branche si elle existe, sinon la crée depuis baseRef (défaut : la branche principale à jour sur origin). Il faut un nom, une branche ou un libellé."
  createWorksession(projectId: ID!, branch: String, name: String, baseRef: String, label: String): Worksession!
  "Renomme le libellé (null ou vide : la branche) et/ou le dossier (git worktree move, seulement si rien n'y tourne)."
  renameWorksession(id: ID!, label: String, name: String): Worksession!
  "Archive la work session avec ses sessions (arrêtées si elles tournent) ; dossier et branche conservés ; restaurable depuis l'historique du projet."
  archiveWorksession(id: ID!): Worksession!
  "Restaure une work session archivée et les sessions archivées avec elle."
  restoreWorksession(id: ID!): Worksession!
  "Supprime la work session (dossier, terminaux fermés) ; ses sessions sont arrêtées si elles tournent puis archivées avec son souvenir, sauf deleteSessions (suppression définitive, historique compris). La branche est conservée sauf deleteBranch."
  deleteWorksession(id: ID!, deleteBranch: Boolean = false, deleteSessions: Boolean = false): Boolean!
  "Crée un élément dans le coffre du projet (administrateurs) ou, sans projectId, dans le coffre personnel."
  createVaultItem(projectId: ID, input: VaultItemInput!): VaultItem!
  "Met à jour un élément (permission MANAGE ; les champs absents sont inchangés)."
  updateVaultItem(id: ID!, input: VaultItemInput!): VaultItem!
  "Supprime un élément (MANAGE) ; un compte Google voit son autorisation révoquée sauf si un autre élément porte le même compte."
  deleteVaultItem(id: ID!): Boolean!
  "Vérifie l'élément depuis le serveur (MANAGE) ; mémorise la clé d'hôte SSH à la première réussite."
  testVaultItem(id: ID!): VaultTest!
  "Duplique l'élément dans le même coffre, secrets compris, sous un nouveau nom (défaut : <nom>-copie) ; MANAGE. Partages, liens et journal ne sont pas copiés ; ni compte Google ni jeton obtenu par connexion."
  duplicateVaultItem(id: ID!, name: String): VaultItem!
  "ssh : nouvelle paire de clés (l'ancienne clé publique est à retirer du serveur)."
  regenerateVaultKey(id: ID!): VaultItem!
  "ssh : oublie la clé d'hôte mémorisée (serveur réinstallé)."
  forgetVaultHostKey(id: ID!): VaultItem!
  "Révèle un champ secret (permission READ) ; journalisé et limité en fréquence."
  revealVaultSecret(id: ID!, field: String!): VaultSecretValue!
  shareVaultItem(id: ID!, email: String!, permission: VaultPermission!): VaultItem!
  "Retire un partage (MANAGE), ou son propre partage."
  unshareVaultItem(id: ID!, userId: ID!): Boolean!
  "Relie l'élément à un projet : PROJECT (tous ses agents : MANAGE + administrateur du projet) ou PERSONAL (ses propres sessions : accès direct + membre)."
  linkVaultItem(id: ID!, projectId: ID!, scope: VaultLinkScope!): VaultItem!
  unlinkVaultItem(linkId: ID!): Boolean!
  "Copie l'élément (secrets compris) dans le coffre d'un projet (MANAGE + administrateur du projet) ; l'original est intact."
  copyVaultItem(id: ID!, projectId: ID!, name: String): VaultItem!
  "Publie un fichier HTML d'un workspace comme page partagée (membres), nouvelle page ou nouvelle version (pageId)."
  publishSharedPage(projectId: ID!, worksessionId: ID, path: String!, title: String!, pageId: ID): SharedPage!
  updateSharedPage(id: ID!, input: SharedPageInput!): SharedPage!
  addSharedPageMember(id: ID!, email: String!): SharedPage!
  "Le propriétaire retire qui il veut ; une personne ajoutée peut se retirer elle-même."
  removeSharedPageMember(id: ID!, userId: ID!): SharedPage!
  deleteSharedPage(id: ID!): Boolean!
  "Abonne cet appareil aux notifications push (notifications système, même application fermée)."
  subscribePush(input: PushSubscriptionInput!): Boolean!
  unsubscribePush(endpoint: String!): Boolean!
  "Envoie une notification de test aux appareils de l'utilisateur ; renvoie leur nombre."
  sendTestPush: Int!
  "Active ou coupe une famille de notifications push pour la personne connectée ; renvoie toutes ses familles."
  setPushPreference(category: String!, enabled: Boolean!): [PushCategory!]!
  "Termine le shell."
  closeTerminal(id: ID!): Terminal!
  deleteTerminal(id: ID!): Boolean!

  createContextFolder(projectId: ID!, parentId: ID, name: String!): ContextFolder!
  renameContextFolder(id: ID!, name: String!): ContextFolder!
  moveContextFolder(id: ID!, parentId: ID): ContextFolder!
  "Supprime le dossier et tout son contenu."
  deleteContextFolder(id: ID!): Boolean!
  createContextInstruction(input: CreateContextInstructionInput!): ContextInstruction!
  "Toute modification de nom, description ou contenu crée une nouvelle version."
  updateContextInstruction(id: ID!, input: UpdateContextInstructionInput!): ContextInstruction!
  deleteContextInstruction(id: ID!): Boolean!
  "Restaure une ancienne version (crée une nouvelle version avec son contenu)."
  restoreContextInstructionVersion(id: ID!, version: Int!): ContextInstruction!
}

type Subscription {
  "Flux d'événements d'une session (SSE)."
  sessionEvents(sessionId: ID!): SessionEvent!
  "Notifié à chaque changement d'état d'une session."
  sessionUpdated: Session!
  "Nouvelle demande d'intervention humaine."
  requestCreated: Request!
  "Demande répondue, annulée ou expirée."
  requestUpdated: Request!
  notificationCreated: Notification!
}

# ---- Planification des sessions --------------------------------------------------------------------

"Planification d'une session : à chaque échéance de l'expression cron, l'instruction est envoyée à la session (relancée si elle est terminée)."
type SessionSchedule {
  "Cinq champs : minute heure jour mois jour-de-semaine, ou alias (@hourly, @daily, @weekly, @monthly)."
  cron: String!
  "Fuseau IANA dans lequel l'expression est interprétée (ex. Europe/Paris)."
  timezone: String!
  "Instruction envoyée à la session à chaque exécution."
  prompt: String!
  enabled: Boolean!
  "Terminer la session à la fin de chaque exécution (défaut) ; sinon elle reste ouverte aux instructions."
  endAfterRun: Boolean!
  nextRunAt: DateTime
  lastRunAt: DateTime
  "Compte rendu de la dernière exécution : terminée (durée, coût), ignorée (raison) ou en erreur."
  lastResult: String
  updatedAt: DateTime!
}

input SessionScheduleInput {
  cron: String!
  timezone: String
  prompt: String!
  "Défaut : true."
  enabled: Boolean
  "Défaut : true."
  endAfterRun: Boolean
  "Réglage de nettoyage de la session, enregistré en même temps que la planification (absent : inchangé). Proposé par défaut : « fresh »."
  cleanup: SessionCleanupInput
}

extend type Session {
  "Planification de la session (null si elle n'est pas planifiée)."
  schedule: SessionSchedule
}

extend type Query {
  "Prochaines échéances d'une expression cron (aperçu) ; erreur si l'expression ou le fuseau est invalide."
  scheduleNextRuns(cron: String!, timezone: String, count: Int = 5): [DateTime!]!
}

extend type Mutation {
  "Crée ou remplace la planification de la session."
  setSessionSchedule(id: ID!, input: SessionScheduleInput!): Session!
  clearSessionSchedule(id: ID!): Session!
  "Exécute la planification maintenant, sans attendre l'échéance."
  runSessionScheduleNow(id: ID!): Session!
}

# ---- Réglages et nettoyage des sessions -----------------------------------------------------------

"Nettoyage automatique de l'historique d'une session (utile aux sessions planifiées)."
type SessionCleanup {
  "Les événements du transcript plus vieux que N jours sont supprimés (null : jamais)."
  retentionDays: Int
  "Conversation de l'agent avant une exécution planifiée : « compact » (compacter) ou « reset » (repartir d'une conversation neuve) quand le contexte dépasse contextMaxTokens ; « fresh » : conversation neuve à chaque exécution. Null : rien."
  contextAction: String
  contextMaxTokens: Int
}

"Taille du contexte de l'agent et ce qu'elle implique (jauge de l'en-tête, pastille de la sidebar, bandeau de nettoyage)."
type SessionContext {
  "Tokens du contexte au dernier tour (null : inconnu)."
  tokens: Int
  "Seuil au-delà duquel l'interface propose de compacter ou de repartir d'une conversation neuve : celui des réglages Claude de la personne connectée (null : elle a désactivé le signalement). Aucune action automatique."
  warnTokens: Int
  overThreshold: Boolean!
  "Modèle retenu pour l'estimation : dernier modèle facturé, sinon celui de la configuration."
  model: String
  "Fenêtre de contexte du modèle (tokens)."
  windowTokens: Int!
  "Part de la fenêtre occupée (0 à 1), null si la taille est inconnue."
  share: Float
  "Coût approximatif de la relecture du contexte à froid (cache expiré) au prochain tour, en dollars."
  coldTurnUsd: Float
}

extend type Session {
  context: SessionContext!
}

input SessionCleanupInput {
  retentionDays: Int
  contextAction: String
  contextMaxTokens: Int
}

input UpdateSessionInput {
  name: String
  "Remplace les réglages de nettoyage (un objet vide les retire)."
  cleanup: SessionCleanupInput
}

extend type Session {
  cleanup: SessionCleanup!
  "Taille du contexte de l'agent au dernier tour (tokens), null si inconnue."
  contextTokens: Int
}

extend type Mutation {
  "Renomme la session et/ou remplace ses réglages de nettoyage."
  updateSession(id: ID!, input: UpdateSessionInput!): Session!
  "Applique tout de suite le nettoyage configuré : purge du transcript, puis compaction ou remise à zéro de la conversation si elle dépasse le seuil."
  applySessionCleanup(id: ID!): Session!
  "Compacte tout de suite la conversation de l'agent (/compact), quel que soit le réglage de nettoyage. Erreur si l'agent travaille."
  compactSessionContext(id: ID!): Session!
  "Repart tout de suite d'une conversation neuve (la session en attente est d'abord terminée) ; avec `keepSummary`, les derniers échanges accompagnent la prochaine instruction. Le transcript affiché est conservé."
  resetSessionContext(id: ID!, keepSummary: Boolean = true): Session!
}
