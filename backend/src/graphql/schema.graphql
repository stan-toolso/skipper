  stopProjectRunner(id: ID!): Project!
  "Supprime le conteneur (pour repartir d'une image à jour) ; les fichiers sont conservés."
  resetProjectRunner(id: ID!): Project!
  "Supprime le projet et tout ce qui en dépend : sessions, terminaux, work sessions, conteneur, dossier de travail. Irréversible. Dépôt hébergé (Forgejo) : supprimé avec deleteHostedRepo, sinon conservé dans Forgejo, archivé (lecture seule) et renommé."
  deleteProject(id: ID!, deleteHostedRepo: Boolean = false): Boolean!
  createSession(input: CreateSessionInput!): Session!
  "Ouvre un chat dans l'espace personnel avec un premier message (config : permissionMode, model) et le lance aussitôt."
  createChat(text: String!, attachments: [AttachmentInput!], config: JSON): Session!
  startSession(id: ID!): Session!
  "Arrêt immédiat de la session (abandon du travail en cours)."
  stopSession(id: ID!): Session!
  "Archive la session et, avec elle, son dossier de travail (terminaux fermés, dossier et branche conservés) : consultable, restaurable et relançable depuis l'historique du projet."
  archiveSession(id: ID!): Session!
  "Restaure une session archivée avec son dossier de travail ; refusé si une autre session y travaille depuis."
  unarchiveSession(id: ID!): Session!
