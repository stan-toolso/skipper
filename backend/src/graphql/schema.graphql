  usd: Float!
}

"Consommation estimée (tarif API) vue du tableau de bord."
type DashboardUsage {
  monthStart: DateTime!
  "Ce mois, sur les projets de l'utilisateur."
  monthUsd: Float!
  "Ce mois, toutes sessions confondues : c'est ce total que le plafond mensuel compare."
  globalMonthUsd: Float!
  monthlyBudgetUsd: Float
  todayUsd: Float!
  last7DaysUsd: Float!
  "Les 7 jours précédant les 7 derniers, pour comparer."
  previous7DaysUsd: Float!
  "Coût par jour sur les 30 derniers jours, jours vides compris."
  byDay: [DashboardUsageDay!]!
  "Sessions les plus coûteuses du mois."
  topSessions: [UsageBySession!]!
}

"Indicateurs d'un projet sur le tableau de bord."
type DashboardProject {
  project: Project!
  busySessions: Int!
  idleSessions: Int!
  pendingRequests: Int!
  todoTasks: Int!
  inProgressTasks: Int!
  overdueTasks: Int!
  monthUsd: Float!
  "Dernière session ou tâche mise à jour."
  lastActivityAt: DateTime
}

"Vue d'ensemble pour l'accueil : ce qui attend l'utilisateur, ce qui tourne et ce que ça coûte, sur ses projets."
type Dashboard {
  generatedAt: DateTime!
  counts: DashboardCounts!
  usage: DashboardUsage!
  "Projets de l'utilisateur, ceux qui réclament une réponse d'abord."
  projects: [DashboardProject!]!
  "Demandes en attente, les plus anciennes d'abord."
  pendingRequests: [Request!]!
  "Sessions en cours (agent au travail ou en attente d'instructions)."
  runningSessions: [Session!]!
  "Dernières sessions arrivées à un état final."
  recentSessions: [Session!]!
  "Tâches ouvertes à surveiller : en retard, urgentes ou hautes."
  attentionTasks: [Task!]!
}

"Connexion GitHub en cours (device flow) : saisir userCode sur verificationUri."
type GithubLogin {
  id: ID!
  userCode: String!
  verificationUri: String!
  expiresAt: DateTime!
  intervalSeconds: Int!
  "pending, done, failed, expired, cancelled"
  status: String!
  error: String
  createdAt: DateTime!
}

type GithubAuthStatus {
  "Identifiant (public) de l'OAuth App GitHub utilisée pour la connexion."
  clientId: String
  "'env' (GITHUB_CLIENT_ID), 'settings' (saisi dans l'interface) ou null."
  clientIdSource: String
  connected: Boolean!
  "'pat' (jeton personnel) ou 'oauth' (device flow)."
  method: String
  login: String
  avatarUrl: String
  scopes: [String!]!
  tokenSetAt: DateTime
  currentLogin: GithubLogin
}

type GithubRepository {
  fullName: String!
  name: String!
  owner: String!
  description: String
  private: Boolean!
  defaultBranch: String!
  cloneUrl: String!
  htmlUrl: String!
  pushedAt: DateTime
}

type AppSettings {
  claude: ClaudeSettings!
  "État du serveur : mode maintenance, sessions actives, reprise automatique."
  server: ServerState!
  claudeAuth: ClaudeAuthStatus!
  github: GithubAuthStatus!
  "Modèles connus (dernière vérification, sinon liste de base)."
  models: [ClaudeModel!]!
  usage: UsageSummary!
}

"État du serveur, à consulter avant un redémarrage."
type ServerState {
  "Mode maintenance : aucune session ne démarre (création, relance, reprise). Levé par un redémarrage."
  maintenance: Boolean!
  maintenanceSince: DateTime
  maintenanceMessage: String
  "Sessions dont le processus tourne sur ce serveur : elles seront interrompues par un redémarrage."
  activeSessions: Int!
  "Parmi elles, celles dont l'agent travaille (tour en cours)."
  busySessions: Int!
  "Au démarrage, relancer les sessions interrompues au milieu d'un tour par l'arrêt précédent (trois au plus, depuis moins d'une heure)."
  autoResumeInterrupted: Boolean!
}

"Connexion OAuth en cours : ouvrir `url`, autoriser, puis fournir le code via completeClaudeLogin."
type ClaudeLogin {
  id: ID!
  kind: ClaudeLoginKind!
  url: String!
  "starting, awaiting_code, exchanging, done, failed"
  status: String!
  error: String
  createdAt: DateTime!
}

input ClaudeSettingsInput {
  authMode: ClaudeAuthMode
  defaultModel: String
  allowedModels: [String!]
  fallbackModel: String
  monthlyBudgetUsd: Float
  sessionBudgetUsd: Float
  defaultMaxTurns: Int
}

type Query {
  "Utilisateur connecté (null sinon). Seule requête accessible sans session."
  me: User
  "Tous les utilisateurs (administrateurs de l'application)."
  users: [User!]!
  "Contenu d'un dossier du workspace du projet (ou du worktree). path vide = racine."
  workspaceEntries(projectId: ID!, worktreeId: ID, path: String = ""): [FileEntry!]!
  "Lecture d'un fichier texte (2 Mo maximum)."
  workspaceFile(projectId: ID!, worktreeId: ID, path: String!): FileContent!
  settings: AppSettings!
  claudeLogin(id: ID!): ClaudeLogin!
  "Dépôts GitHub accessibles avec la connexion GitHub (les plus récents d'abord)."
  githubRepositories(query: String): [GithubRepository!]!
  providers: [Provider!]!
  sessions(projectId: ID, status: SessionStatus, provider: String, limit: Int, offset: Int): [Session!]!
  session(id: ID!): Session
  projects: [Project!]!
  project(id: ID!): Project
  "Demandes, toutes sessions confondues. `status` à null renvoie tout l'historique (par défaut : celles en attente)."
  requests(status: RequestStatus = PENDING, sessionId: ID, limit: Int, newestFirst: Boolean = false): [Request!]!
  request(id: ID!): Request
  terminal(id: ID!): Terminal
  worktree(id: ID!): Worktree
  connection(id: ID!): Connection
  "Suivi git d'un workspace (checkout principal) ou d'un worktree."
  gitStatus(projectId: ID!, worktreeId: ID): GitStatus!
  gitDiff(projectId: ID!, worktreeId: ID, path: String!, staged: Boolean = false): GitDiff!
  gitCommitDiff(projectId: ID!, worktreeId: ID, hash: String!): GitDiff!
  gitBranches(projectId: ID!, worktreeId: ID): [GitBranch!]!
  gitLog(projectId: ID!, worktreeId: ID, limit: Int): [GitCommit!]!
  "Pull requests GitHub du dépôt du projet, les plus récemment mises à jour d'abord."
  githubPullRequests(projectId: ID!, state: PullRequestFilter = OPEN, limit: Int): [PullRequest!]!
  githubPullRequest(projectId: ID!, number: Int!): PullRequest!
  "Titre, description et base proposés pour une pull request de la branche courante du workspace."
  githubPullRequestDraft(projectId: ID!, worktreeId: ID): PullRequestDraft!
  notifications(unreadOnly: Boolean = false, limit: Int): [Notification!]!
  unreadNotificationCount: Int!
  "Tableau de bord de l'utilisateur connecté."
  dashboard: Dashboard!
  "Tâches, tous projets confondus (par défaut : ouvertes)."
  tasks(projectId: ID, status: [TaskStatus!], priority: TaskPriority, limit: Int): [Task!]!
  task(id: ID!): Task
  contextInstruction(id: ID!): ContextInstruction
  searchContext(projectId: ID!, query: String!): [ContextInstruction!]!
}

input CreateContextInstructionInput {
  projectId: ID!
  folderId: ID
  name: String!
  description: String
  content: String
  changeNote: String
}

input UpdateContextInstructionInput {
  name: String
  description: String
  content: String
  "Dossier cible (null = racine) pour déplacer l'instruction."
  folderId: ID
  changeNote: String
}

input CreateProjectInput {
  name: String!
  "Optionnel : dérivé du nom si absent."
  slug: String
  description: String
  systemPrompt: String
  gitUrl: String
  gitBranch: String
  runnerConfig: JSON
  defaultPermissionMode: String
}

input UpdateProjectInput {
  name: String
  description: String
  systemPrompt: String
  gitUrl: String
  gitBranch: String
  runnerConfig: JSON
  defaultPermissionMode: String
}

"Worktree à créer en même temps que la session, qui s'y exécutera."
input NewWorktreeInput {
  "Branche extraite si elle existe (localement ou sur origin), sinon créée depuis baseRef."
  branch: String!
  "Nom du dossier (défaut : dérivé de la branche)."
  name: String
  baseRef: String
}

"Fichier joint à une instruction : contenu encodé en base64 (10 Mo par fichier, 12 Mo par instruction, 10 fichiers au plus)."
input AttachmentInput {
  name: String!
  mediaType: String!
  data: String!
}

input CreateSessionInput {
  projectId: ID!
  worktreeId: ID
  "Crée d'abord ce worktree et y lance la session (exclusif avec worktreeId)."
  newWorktree: NewWorktreeInput
  name: String!
  provider: String!
  "Première instruction. Facultative : sans consigne ni fichier joint, la session est créée sans démarrer et attend sa première instruction."
  prompt: String
  "Fichiers joints à la première instruction."
  attachments: [AttachmentInput!]
  config: JSON
  "Démarre la session immédiatement après création (défaut : true) ; sans effet sans consigne."
  autoStart: Boolean
}

type Mutation {
  "Écrit un fichier. Avec expectedModifiedAt, refuse (FILE_CONFLICT) si le fichier a changé depuis."
  writeWorkspaceFile(projectId: ID!, worktreeId: ID, path: String!, content: String!, expectedModifiedAt: DateTime): FileContent!
  createWorkspaceEntry(projectId: ID!, worktreeId: ID, path: String!, kind: FileEntryKind!): FileEntry!
  renameWorkspaceEntry(projectId: ID!, worktreeId: ID, path: String!, newPath: String!): FileEntry!
  "Supprime un fichier ou un dossier (récursivement)."
  deleteWorkspaceEntry(projectId: ID!, worktreeId: ID, path: String!): Boolean!

  "Active ou lève le mode maintenance (refuse les nouvelles sessions avant un redémarrage)."
  setMaintenanceMode(enabled: Boolean!, message: String): AppSettings!
  "Réglages du serveur : reprise automatique des sessions interrompues."
  updateServerSettings(autoResumeInterrupted: Boolean!): AppSettings!
  "Met à jour les réglages Claude (les champs absents sont inchangés ; null efface)."
  updateClaudeSettings(input: ClaudeSettingsInput!): AppSettings!
  "Enregistre (chiffrée) la clé API Anthropic ; null la supprime."
  setClaudeApiKey(apiKey: String): AppSettings!
  "Supprime le jeton OAuth enregistré."
  clearClaudeOauthToken: AppSettings!
  "Lance la connexion : renvoie l'URL d'autorisation à ouvrir."
  startClaudeLogin(kind: ClaudeLoginKind = oauth): ClaudeLogin!
  "GitHub : enregistre l'identifiant de l'OAuth App (null pour effacer)."
  setGithubClientId(clientId: String): AppSettings!
  "GitHub : enregistre un jeton d'accès personnel après vérification auprès de GitHub."
  setGithubPersonalToken(token: String!): AppSettings!
  "GitHub : démarre la connexion par device flow."
  startGithubLogin: GithubLogin!
  cancelGithubLogin: AppSettings!
  "GitHub : oublie le jeton."
  disconnectGithub: AppSettings!
  "Transmet le code d'autorisation ; en cas de succès le mode passe à celui du parcours (oauth ou server)."
  completeClaudeLogin(id: ID!, code: String!): ClaudeLogin!
  "Déconnecte le compte du serveur (claude auth logout)."
  logoutServerClaude: AppSettings!
  cancelClaudeLogin(id: ID!): Boolean!
  "Interroge Claude Code avec l'authentification du mode indiqué (défaut : mode courant) : compte et modèles."
  verifyClaudeAuth(mode: ClaudeAuthMode): AppSettings!

  "Invite un e-mail sur le projet (l'utilisateur est créé s'il n'existe pas) ou change son rôle. Réservé aux administrateurs du projet."
  inviteProjectMember(projectId: ID!, email: String!, role: ProjectRole = MEMBER): ProjectMember!
  updateProjectMemberRole(projectId: ID!, userId: ID!, role: ProjectRole!): ProjectMember!
  removeProjectMember(projectId: ID!, userId: ID!): Boolean!
  "Ajoute une autorisation mémorisée au projet (membres). ruleContent vide = tout l'outil."
  addProjectPermissionRule(projectId: ID!, toolName: String!, ruleContent: String): PermissionRule!
  "Retire une autorisation mémorisée : les prochaines sessions redemanderont."
  deleteProjectPermissionRule(id: ID!): Boolean!

  "Crée le projet et prépare son workspace (clone git si une URL est fournie). Le créateur en devient administrateur."
  createProject(input: CreateProjectInput!): Project!
  updateProject(id: ID!, input: UpdateProjectInput!): Project!
  "(Re)crée le workspace s'il n'existe pas sur disque."
  prepareProjectWorkspace(id: ID!): Project!
  "Démarre l'environnement d'exécution (conteneur) du projet."
  startProjectRunner(id: ID!): Project!
  "Arrête l'environnement d'exécution ; les sessions en cours sont interrompues."
  stopProjectRunner(id: ID!): Project!
  "Supprime le conteneur (pour repartir d'une image à jour) ; les fichiers sont conservés."
  resetProjectRunner(id: ID!): Project!
  "Supprime le projet et tout ce qui en dépend : sessions, terminaux, worktrees, conteneur, dossier de travail. Irréversible."
  deleteProject(id: ID!): Boolean!
  createSession(input: CreateSessionInput!): Session!
  startSession(id: ID!): Session!
  "Arrêt immédiat de la session (abandon du travail en cours)."
  stopSession(id: ID!): Session!
  deleteSession(id: ID!): Boolean!
  "Envoie une instruction (texte et fichiers joints ; l'un des deux au moins). Une session terminée est relancée."
  sendSessionMessage(id: ID!, text: String!, attachments: [AttachmentInput!]): Session!
  "Fin propre : l'agent termine son tour, puis la session se termine."
  endSession(id: ID!): Session!
  "Interrompt le tour en cours ; la session reste ouverte aux instructions."
  interruptSession(id: ID!): Session!
  """
  Modifie la configuration d'une session (fusion clé par clé ; null retire une clé). Une session en cours applique
  immédiatement ce qu'elle peut (Claude : modèle et autorisations) ; le reste vaut pour son prochain lancement.
  """
  updateSessionConfig(id: ID!, config: JSON!): Session!
  "Répond à une demande en attente ; la session reprend avec cette réponse."
  answerRequest(id: ID!, response: JSON!): Request!
  "Abandonne une demande : l'agent reçoit un refus."
  cancelRequest(id: ID!): Request!

  markNotificationRead(id: ID!): Notification!
  "Renvoie le nombre de notifications marquées."
  markAllNotificationsRead: Int!
  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  deleteTask(id: ID!): Boolean!
  "Confie la tâche à un agent. Sans worktreeId, un worktree dédié (task/<slug>) est créé si le projet est relié à git, sauf dedicatedWorktree: false (dossier principal)."
  startTaskSession(id: ID!, provider: String, config: JSON, worktreeId: ID, dedicatedWorktree: Boolean = true): Session!

  "git add (paths vide = tout)."
  gitStage(projectId: ID!, worktreeId: ID, paths: [String!]!): GitStatus!
  "git reset (paths vide = tout)."
  gitUnstage(projectId: ID!, worktreeId: ID, paths: [String!]!): GitStatus!
  "Abandonne les modifications non indexées ; supprime un fichier non suivi."
  gitDiscard(projectId: ID!, worktreeId: ID, paths: [String!]!): GitStatus!
  gitCommit(projectId: ID!, worktreeId: ID, message: String!, stageAll: Boolean = false): GitStatus!
  gitFetch(projectId: ID!, worktreeId: ID): GitStatus!
  gitPull(projectId: ID!, worktreeId: ID): GitStatus!
  gitPush(projectId: ID!, worktreeId: ID): GitStatus!
  "Bascule sur une branche (locale ou origin/...) ; create = nouvelle branche depuis HEAD."
  gitCheckout(projectId: ID!, worktreeId: ID, branch: String!, create: Boolean = false): GitStatus!
  "Pousse la branche courante du workspace puis ouvre une pull request GitHub (base par défaut : branche du projet, sinon celle du dépôt)."
  createPullRequest(projectId: ID!, worktreeId: ID, title: String!, body: String, base: String, draft: Boolean = false): PullRequest!
  "Fusionne une pull request puis nettoie (branche distante, worktree, branche locale, tâches) et met à jour le dossier principal."
  mergePullRequest(projectId: ID!, number: Int!, method: PullRequestMergeMethod = MERGE, cleanup: MergePullRequestCleanup): MergePullRequestResult!

  "Ouvre un shell dans le workspace du projet (ou dans un worktree)."
  createTerminal(projectId: ID!, name: String, worktreeId: ID): Terminal!
  "Crée un worktree git : extrait la branche si elle existe, sinon la crée depuis baseRef (défaut : HEAD du checkout principal)."
  createWorktree(projectId: ID!, branch: String!, name: String, baseRef: String): Worktree!
  "Supprime le worktree et tout ce qui y est rattaché (sessions arrêtées, terminaux fermés, dossier) ; la branche est conservée sauf deleteBranch."
  deleteWorktree(id: ID!, deleteBranch: Boolean = false): Boolean!
  "Crée une connexion ; pour ssh sans privateKey, génère une paire de clés (la clé publique est à installer sur le serveur)."
  createConnection(projectId: ID!, input: ConnectionInput!): Connection!
  "Met à jour une connexion (les champs absents sont inchangés)."
  updateConnection(id: ID!, input: ConnectionInput!): Connection!
  deleteConnection(id: ID!): Boolean!
  "Vérifie la connexion depuis le serveur ; mémorise la clé d'hôte SSH à la première réussite."
  testConnection(id: ID!): ConnectionTest!
  "ssh : nouvelle paire de clés (l'ancienne clé publique est à retirer du serveur)."
  regenerateConnectionKey(id: ID!): Connection!
  "ssh : oublie la clé d'hôte mémorisée (serveur réinstallé)."
  forgetConnectionHostKey(id: ID!): Connection!
  "Vérifie qu'un compte Google du projet répond encore (jeton renouvelé, profil, Gmail, Drive)."
  checkGoogleAccount(id: ID!): GoogleAccountCheck!
  "Détache un compte Google du projet et révoque le jeton côté Google."
  disconnectGoogleAccount(id: ID!): Project!
  "Termine le shell."
  closeTerminal(id: ID!): Terminal!
  deleteTerminal(id: ID!): Boolean!

  createContextFolder(projectId: ID!, parentId: ID, name: String!): ContextFolder!
  renameContextFolder(id: ID!, name: String!): ContextFolder!
  moveContextFolder(id: ID!, parentId: ID): ContextFolder!
  "Supprime le dossier et tout son contenu."
  deleteContextFolder(id: ID!): Boolean!
  createContextInstruction(input: CreateContextInstructionInput!): ContextInstruction!
  "Toute modification de nom, description ou contenu crée une nouvelle version."
  updateContextInstruction(id: ID!, input: UpdateContextInstructionInput!): ContextInstruction!
  deleteContextInstruction(id: ID!): Boolean!
  "Restaure une ancienne version (crée une nouvelle version avec son contenu)."
  restoreContextInstructionVersion(id: ID!, version: Int!): ContextInstruction!
}

type Subscription {
  "Flux d'événements d'une session (SSE)."
  sessionEvents(sessionId: ID!): SessionEvent!
  "Notifié à chaque changement d'état d'une session."
  sessionUpdated: Session!
  "Nouvelle demande d'intervention humaine."
  requestCreated: Request!
  "Demande répondue, annulée ou expirée."
  requestUpdated: Request!
  notificationCreated: Notification!
}

# ---- Planification des sessions --------------------------------------------------------------------

"Planification d'une session : à chaque échéance de l'expression cron, l'instruction est envoyée à la session (relancée si elle est terminée)."
type SessionSchedule {
  "Cinq champs : minute heure jour mois jour-de-semaine, ou alias (@hourly, @daily, @weekly, @monthly)."
  cron: String!
  "Fuseau IANA dans lequel l'expression est interprétée (ex. Europe/Paris)."
  timezone: String!
  "Instruction envoyée à la session à chaque exécution."
  prompt: String!
  enabled: Boolean!
  "Terminer la session à la fin de chaque exécution (défaut) ; sinon elle reste ouverte aux instructions."
  endAfterRun: Boolean!
  nextRunAt: DateTime
  lastRunAt: DateTime
  "Compte rendu de la dernière exécution : terminée (durée, coût), ignorée (raison) ou en erreur."
  lastResult: String
  updatedAt: DateTime!
}

input SessionScheduleInput {
  cron: String!
  timezone: String
  prompt: String!
  "Défaut : true."
  enabled: Boolean
  "Défaut : true."
  endAfterRun: Boolean
}

extend type Session {
  "Planification de la session (null si elle n'est pas planifiée)."
  schedule: SessionSchedule
}

extend type Query {
  "Prochaines échéances d'une expression cron (aperçu) ; erreur si l'expression ou le fuseau est invalide."
  scheduleNextRuns(cron: String!, timezone: String, count: Int = 5): [DateTime!]!
}

extend type Mutation {
  "Crée ou remplace la planification de la session."
  setSessionSchedule(id: ID!, input: SessionScheduleInput!): Session!
  clearSessionSchedule(id: ID!): Session!
  "Exécute la planification maintenant, sans attendre l'échéance."
  runSessionScheduleNow(id: ID!): Session!
}

# ---- Réglages et nettoyage des sessions -----------------------------------------------------------

"Nettoyage automatique de l'historique d'une session (utile aux sessions planifiées)."
type SessionCleanup {
  "Les événements du transcript plus vieux que N jours sont supprimés (null : jamais)."
  retentionDays: Int
  "Quand le contexte de l'agent dépasse contextMaxTokens : « compact » (compacter la conversation) ou « reset » (repartir d'une conversation neuve). Null : rien."
  contextAction: String
  contextMaxTokens: Int
}

input SessionCleanupInput {
  retentionDays: Int
  contextAction: String
  contextMaxTokens: Int
}

input UpdateSessionInput {
  name: String
  "Remplace les réglages de nettoyage (un objet vide les retire)."
  cleanup: SessionCleanupInput
}

extend type Session {
  cleanup: SessionCleanup!
  "Taille du contexte de l'agent au dernier tour (tokens), null si inconnue."
  contextTokens: Int
}

extend type Mutation {
  "Renomme la session et/ou remplace ses réglages de nettoyage."
  updateSession(id: ID!, input: UpdateSessionInput!): Session!
  "Applique tout de suite le nettoyage configuré : purge du transcript, puis compaction ou remise à zéro de la conversation si elle dépasse le seuil."
  applySessionCleanup(id: ID!): Session!
}
