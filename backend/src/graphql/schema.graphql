  "Titre, description et base proposés pour une pull request de la branche courante du workspace."
  githubPullRequestDraft(projectId: ID!, worksessionId: ID): PullRequestDraft!
  """
  Pull requests suivies : d'un projet (synchronisées avec GitHub au passage, au plus toutes les 30 s) ou de tous les projets
  de l'utilisateur ; filtres par tâche, statut et étape. Celles qui attendent une action d'abord (à fusionner, à déployer).
  """
  pullRequests(projectId: ID, taskId: ID, status: [TrackedPullRequestStatus!], stage: [PullRequestStage!], limit: Int): [TrackedPullRequest!]!
  pullRequest(id: ID!): TrackedPullRequest
  notifications(unreadOnly: Boolean = false, limit: Int): [Notification!]!
  unreadNotificationCount: Int!
  "Tableau de bord de l'utilisateur connecté."
  dashboard: Dashboard!
  "Tâches, tous projets confondus (par défaut : ouvertes). assignee / reporter : texte cherché dans le nom ou l'e-mail ; mine : tâches dont le responsable a mon e-mail ; tag : tâches portant cette étiquette (sans tenir compte de la casse)."
  tasks(projectId: ID, status: [TaskStatus!], priority: TaskPriority, assignee: String, reporter: String, tag: String, mine: Boolean, limit: Int): [Task!]!
