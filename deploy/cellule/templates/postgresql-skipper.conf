# Réglages PostgreSQL 17 pour une cellule Skipper (machine de 32 Go partagée avec Docker et le backend).
# Installé dans /etc/postgresql/17/main/conf.d/skipper.conf par deploy/cellule/postgres.sh.
listen_addresses = 'localhost'
max_connections = 100
shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB
wal_buffers = 64MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d '
log_checkpoints = on
log_lock_waits = on
timezone = 'Europe/Paris'
# Archivage WAL : activé par postgres.sh seulement quand pgBackRest est configuré (sinon le disque se remplirait).
__ARCHIVE__
