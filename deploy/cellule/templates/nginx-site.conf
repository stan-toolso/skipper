# Site nginx de Skipper pour une cellule. __DOMAIN__ est remplacé par deploy/cellule/bootstrap.sh.
# Certbot (python3-certbot-nginx) ajoute lui-même le bloc TLS et la redirection 80 → 443 ; bootstrap.sh ajoute
# ensuite `http2` aux directives `listen 443 ssl` (nginx 1.24 : pas de directive `http2 on`).
upstream skipper_backend {
    server 127.0.0.1:4100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/skipper;
    index index.html;
    client_max_body_size 64m;

    # Compression : le bundle Vite (2,4 Mo brut, 0,7 Mo gzippé), le CSS et les réponses GraphQL (JSON) partent compressés.
    # Le `gzip on` global de nginx.conf ne couvre que text/html tant que gzip_types y reste commenté. Pas de
    # text/event-stream : les subscriptions SSE doivent passer sans tampon.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # En-têtes de sécurité (les en-têtes applicatifs complets sont suivis par la tâche 63422c86).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Bundles Vite : noms hachés, cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker et manifeste : jamais en cache, pour que chaque déploiement soit pris en compte.
    location ~ ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Forge Forgejo des dépôts hébergés (deploy/cellule/forgejo.sh) : la personne connectée à Skipper y est connectée
    # (nginx demande son compte Forgejo à Skipper et le transmet dans X-WEBAUTH-USER) ; sans session, une page web renvoie
    # vers la connexion de Skipper, git et l'API passent (jetons). Pushes sans limite de taille ni mise en tampon.
    location = /_forge_auth {
        internal;
        proxy_pass http://skipper_backend/api/forge/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }
    location @forge_login {
        return 302 /auth/google?next=$request_uri;
    }
    location = /forge {
        return 301 /forge/;
    }
    location ^~ /forge/ {
        auth_request /_forge_auth;
        auth_request_set $forge_user $upstream_http_x_forge_user;
        error_page 401 = @forge_login;
        proxy_set_header X-WEBAUTH-USER $forge_user;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend : GraphQL (HTTP et WebSocket), authentification, API, terminaux, navigateurs.
    location ~ ^/(graphql|auth/|api/|terminals/|browsers/) {
        proxy_pass http://skipper_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Application monopage : tout le reste revient à index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
