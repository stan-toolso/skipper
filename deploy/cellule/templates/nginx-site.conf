# Site nginx de Skipper pour une cellule. __DOMAIN__ est remplacé par deploy/cellule/bootstrap.sh.
# Certbot (python3-certbot-nginx) ajoute lui-même le bloc TLS et la redirection 80 → 443 ; bootstrap.sh ajoute
# ensuite `http2` aux directives `listen 443 ssl` (nginx 1.24 : pas de directive `http2 on`).
# Instance active du backend : skipper@blue (4101) ou skipper@green (4102), commutée par deploy/cellule/deploy.sh
# (bleu/vert) dans ce fichier inclus, puis nginx rechargé ; les connexions ouvertes (SSE, WebSockets) restent sur
# l'ancienne instance jusqu'à sa sortie.
upstream skipper_backend {
    include /etc/nginx/skipper-upstream.conf;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/skipper;
    index index.html;
    client_max_body_size 64m;

    # Compression : le bundle Vite (2,4 Mo brut, 0,7 Mo gzippé), le CSS et les réponses GraphQL (JSON) partent compressés.
    # Le `gzip on` global de nginx.conf ne couvre que text/html tant que gzip_types y reste commenté. Pas de
    # text/event-stream : les subscriptions SSE doivent passer sans tampon.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # En-têtes de sécurité (les en-têtes applicatifs complets sont suivis par la tâche 63422c86).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Bundles Vite : noms hachés, cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker et manifeste : jamais en cache, pour que chaque déploiement soit pris en compte.
    location ~ ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Dépôts git hébergés par Skipper (smart HTTP) : un push envoie tout le pack en une requête, sans limite de taille
    # ni mise en tampon (le backend le passe à git http-backend au fil de l'eau).
    location ^~ /api/git/ {
        proxy_pass http://skipper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend : GraphQL (HTTP et WebSocket), authentification, API, terminaux, navigateurs.
    location ~ ^/(graphql|auth/|api/|terminals/|browsers/) {
        proxy_pass http://skipper_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Application monopage : tout le reste revient à index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
