# Site nginx de Skipper pour une cellule. __DOMAIN__ est remplacé par deploy/cellule/bootstrap.sh.
# Certbot (python3-certbot-nginx) ajoute lui-même le bloc TLS et la redirection 80 → 443.
upstream skipper_backend {
    server 127.0.0.1:4100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/skipper;
    index index.html;
    client_max_body_size 64m;

    # En-têtes de sécurité (les en-têtes applicatifs complets sont suivis par la tâche 63422c86).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Bundles Vite : noms hachés, cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker et manifeste : jamais en cache, pour que chaque déploiement soit pris en compte.
    location ~ ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Backend : GraphQL (HTTP et WebSocket), authentification, API, terminaux, navigateurs.
    location ~ ^/(graphql|auth/|api/|terminals/|browsers/) {
        proxy_pass http://skipper_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Application monopage : tout le reste revient à index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
