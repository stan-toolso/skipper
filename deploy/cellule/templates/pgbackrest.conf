# pgBackRest : sauvegarde continue de PostgreSQL vers un bucket Object Storage Scaleway (S3), chiffrée.
# Installé par deploy/cellule/postgres.sh ; les valeurs __X__ sont remplacées.
[global]
repo1-type=s3
repo1-s3-endpoint=s3.__S3_REGION__.scw.cloud
repo1-s3-region=__S3_REGION__
repo1-s3-bucket=__S3_BUCKET__
repo1-s3-key=__S3_KEY__
repo1-s3-key-secret=__S3_SECRET__
repo1-s3-uri-style=path
repo1-path=/__HOSTNAME__/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=__CIPHER_PASS__
repo1-bundle=y
repo1-block=y
process-max=2
compress-type=zst
log-level-console=info
log-level-file=detail
start-fast=y
delta=y

[skipper]
pg1-path=/var/lib/postgresql/17/main
