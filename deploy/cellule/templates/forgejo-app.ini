# Configuration de Forgejo pour une cellule Skipper (deploy/cellule/forgejo.sh). Les __VARIABLES__ sont remplacées à
# la première installation ; le fichier installé (/var/lib/forgejo/conf/app.ini) n'est plus réécrit ensuite.
APP_NAME = Forge Skipper
RUN_MODE = prod
RUN_USER = git
WORK_PATH = /var/lib/gitea

[server]
PROTOCOL = http
# Écoute locale seulement : nginx (connexion par la session Skipper) et le backend de Skipper (jeton administrateur).
HTTP_ADDR = 127.0.0.1
HTTP_PORT = __PORT__
ROOT_URL = __ROOT_URL__/
DOMAIN = __DOMAIN__
DISABLE_SSH = true
START_SSH_SERVER = false
OFFLINE_MODE = true
LFS_START_SERVER = true
LFS_JWT_SECRET = __LFS_JWT_SECRET__
APP_DATA_PATH = /var/lib/gitea/data

[database]
DB_TYPE = postgres
HOST = 127.0.0.1:5432
NAME = forgejo
USER = forgejo
PASSWD = __DB_PASSWORD__
SSL_MODE = disable

[repository]
ROOT = /var/lib/gitea/git/repositories
DEFAULT_PRIVATE = private
DEFAULT_BRANCH = main
DISABLE_HTTP_GIT = false

[security]
INSTALL_LOCK = true
SECRET_KEY = __SECRET_KEY__
INTERNAL_TOKEN = __INTERNAL_TOKEN__
# Authentification par proxy : nginx transmet le compte de la personne connectée à Skipper (voir gitServer/httpRoute.ts).
REVERSE_PROXY_AUTHENTICATION_USER = X-WEBAUTH-USER
REVERSE_PROXY_TRUSTED_PROXIES = 127.0.0.1/32,::1/128
REVERSE_PROXY_LIMIT = 1

[service]
DISABLE_REGISTRATION = true
SHOW_REGISTRATION_BUTTON = false
ENABLE_REVERSE_PROXY_AUTHENTICATION = true
ENABLE_REVERSE_PROXY_AUTO_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = true
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = false
ENABLE_NOTIFY_MAIL = false

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[oauth2]
JWT_SECRET = __JWT_SECRET__

[api]
MAX_RESPONSE_ITEMS = 100

[webhook]
# Les webhooks visent Skipper par son adresse publique (l'instance active du backend, derrière nginx).
ALLOWED_HOST_LIST = loopback,__DOMAIN__

[mailer]
ENABLED = false

[session]
PROVIDER = db
COOKIE_SECURE = true

[log]
MODE = console
LEVEL = Warn

[actions]
ENABLED = true

[cron.update_checker]
ENABLED = false
