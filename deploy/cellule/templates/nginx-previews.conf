# Aperçus des work sessions (PREVIEW_URL=https://*.apercu.__DOMAIN__ dans le .env) : tout nom `<aperçu>.apercu.__DOMAIN__`
# est envoyé au backend actif, qui relaie au serveur de développement de la branche dans le conteneur du projet
# (backend/src/previews/proxy.ts) et contrôle l'accès (cookie propre au sous-domaine). __DOMAIN__ est remplacé à
# l'installation, comme pour nginx-site.conf.
#
# Prérequis (voir DEPLOY.md, « Aperçus des branches ») : un enregistrement DNS générique `*.apercu.__DOMAIN__` vers la
# cellule, et un certificat générique obtenu par défi DNS-01 (Let's Encrypt n'en délivre pas par défi HTTP), rangé dans
# /etc/letsencrypt/live/apercu.__DOMAIN__/. Les en-têtes de sécurité de l'application ne s'appliquent pas ici : les
# pages viennent de l'application en développement, qui doit pouvoir s'afficher dans le cadre du panneau de Skipper.
server {
    listen 80;
    listen [::]:80;
    server_name *.apercu.__DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.apercu.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/apercu.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apercu.__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    client_max_body_size 64m;

    location / {
        proxy_pass http://skipper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rechargement à chaud (WebSocket de Vite, Next…) et flux longs du serveur de développement.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
