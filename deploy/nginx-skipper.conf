# Skipper (skipper.toolso.io) : front statique + API GraphQL (SSE) + terminaux (WebSocket).
# Copie de /etc/nginx/sites-available/skipper sur le serveur (les blocs « managed by Certbot »
# pour le TLS et la redirection HTTP -> HTTPS sont ajoutés par certbot et ne figurent pas ici).
# Le backend Node écoute en local sur le port 4100 (4000 est pris par l'API Curso).
# En-têtes de sécurité et de cache. Un `add_header` dans une location annule TOUS ceux du bloc server : ils sont donc
# tous posés ici, au niveau server, et la valeur qui dépend du chemin vient d'un `map` (une valeur vide n'émet pas
# l'en-tête). Ne pas ajouter d'add_header dans une location sans y répéter ceux-ci.
#
# Cache : bundles Vite aux noms hachés en cache long ; coquille de l'application (index.html, aussi servi pour les
# routes du front après try_files), service worker, manifeste et script de thème toujours revalidés.
map $uri $skipper_cache_control {
    ~^/assets/                                                                                   "public, max-age=31536000, immutable";
    ~^/(index\.html|sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|theme-init\.js)$  "no-cache";
    default                                                                                      "";
}

# Content-Security-Policy de l'application. Les réponses du backend n'en reçoivent pas d'ici : les pages partagées et
# les fichiers vus dans un bac à sable (/api/shared, /api/files/view) portent la leur (sandbox) et chargent librement
# leurs scripts depuis des CDN. Styles en ligne permis (React, CodeMirror, xterm) ; aucun script en ligne (le thème
# initial est dans /theme-init.js). Images https (avatars Google et GitHub, images des textes Markdown), data: et
# blob: (navigateur en direct, aperçus). Personne ne peut afficher l'application dans un cadre (clickjacking).
map $uri $skipper_csp {
    ~^/(graphql|api/|auth/|terminals/|browsers/)  "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://$host; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    server_name skipper.toolso.io;
    listen 80;

    root /var/www/skipper;
    index index.html;

    # L'application authentifie elle-même ses utilisateurs (Google OAuth) ; l'ancienne authentification
    # basic nginx est désactivée (à réactiver en cas de besoin : /etc/nginx/.htpasswd-skipper existe toujours).
    # auth_basic "Skipper";
    # auth_basic_user_file /etc/nginx/.htpasswd-skipper;

    client_max_body_size 20M;

    # En-têtes de sécurité (voir les map en tête de fichier) ; version de nginx masquée.
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $skipper_csp always;
    add_header Cache-Control $skipper_cache_control;

    # Compression : le bundle Vite (2,4 Mo brut, 0,7 Mo gzippé), le CSS et les réponses GraphQL (JSON) partent compressés.
    # Le `gzip on` global de nginx.conf ne couvre que text/html tant que gzip_types y reste commenté. Pas de
    # text/event-stream : les subscriptions SSE doivent passer sans tampon.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Manifeste de l'application installable : type MIME explicite (absent de mime.types) ; jamais mis en cache (map).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # GraphQL : requêtes + subscriptions SSE (pas de buffering, connexions longues).
    location /graphql {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Connexion Google : redirections vers Google et retour (cookie de session).
    location /auth/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dépôts git hébergés par Skipper (smart HTTP) : pushes sans limite de taille ni mise en tampon.
    location ^~ /api/git/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Pièces jointes des sessions : /api/attachments/<session>/<id>
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Terminaux : WebSocket /terminals/<id>
    location /terminals/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vue en direct du navigateur des sessions : WebSocket /browsers/<session>
    location /browsers/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
